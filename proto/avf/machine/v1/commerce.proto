syntax = "proto3";

package avf.machine.v1;

import "avf/machine/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/avf/avf-vending-api/proto/avf/machine/v1;machinev1";

// MachineCommerceService is the kiosk sale API (Machine JWT). All order scope is the authenticated machine.
// Payment provider webhooks remain on REST; QR flows poll GetOrder / GetOrderStatus after PSP updates payment.
service MachineCommerceService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc CreateQuote(CreateQuoteRequest) returns (CreateQuoteResponse);
  rpc CreateOrderFromQuote(CreateOrderFromQuoteRequest) returns (CreateOrderFromQuoteResponse);
  rpc CreatePaymentSession(CreatePaymentSessionRequest) returns (CreatePaymentSessionResponse);
  // AttachPaymentResult is an alias of CreatePaymentSession (spec-native name).
  rpc AttachPaymentResult(CreatePaymentSessionRequest) returns (CreatePaymentSessionResponse);
  rpc ConfirmCashPayment(ConfirmCashPaymentRequest) returns (ConfirmCashPaymentResponse);
  // CreateCashCheckout is an alias of ConfirmCashPayment (spec-native name for cash tenders).
  rpc CreateCashCheckout(ConfirmCashPaymentRequest) returns (ConfirmCashPaymentResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc GetOrderStatus(GetOrderStatusRequest) returns (GetOrderStatusResponse);
  rpc StartVend(StartVendRequest) returns (StartVendResponse);
  rpc ConfirmVendSuccess(ConfirmVendSuccessRequest) returns (ConfirmVendSuccessResponse);
  rpc ReportVendSuccess(ReportVendSuccessRequest) returns (ReportVendSuccessResponse);
  rpc ReportVendFailure(ReportVendFailureRequest) returns (ReportVendFailureResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
}

// MachineSaleService is the native vending machine runtime sale API (Machine JWT).
// Handlers delegate to the same commerce orchestration as MachineCommerceService / REST.
service MachineSaleService {
  rpc CreateSale(CreateSaleRequest) returns (CreateSaleResponse);
  rpc AttachPayment(AttachPaymentRequest) returns (AttachPaymentResponse);
  rpc ConfirmCashReceived(ConfirmCashReceivedRequest) returns (ConfirmCashReceivedResponse);
  rpc StartVend(StartVendRequest) returns (StartVendResponse);
  rpc CompleteVend(ConfirmVendSuccessRequest) returns (ConfirmVendSuccessResponse);
  rpc FailVend(ReportVendFailureRequest) returns (ReportVendFailureResponse);
  rpc CancelSale(CancelOrderRequest) returns (CancelOrderResponse);
}

message CreateSaleRequest {
  CreateOrderRequest order = 1;
}

message CreateSaleResponse {
  CreateOrderResponse order = 1;
}

message AttachPaymentRequest {
  CreatePaymentSessionRequest payment_session = 1;
}

message AttachPaymentResponse {
  CreatePaymentSessionResponse payment_session = 1;
}

message ConfirmCashReceivedRequest {
  ConfirmCashPaymentRequest payment = 1;
}

message ConfirmCashReceivedResponse {
  ConfirmCashPaymentResponse payment = 1;
}

message SlotSelection {
  optional string slot_id = 1;
  string cabinet_code = 2;
  string slot_code = 3;
  optional int32 slot_index = 4;
}

// SimulationContext tags enterprise HIL rows; excluded from real revenue when simulated=true.
message SimulationContext {
  bool simulated = 1;
  string simulation_run_id = 2;
  string simulation_scenario = 3;
  bool fake_bill = 4;
  bool fake_board = 5;
}

message CreateOrderRequest {
  IdempotencyContext context = 1;
  // Optional echo of machine_id; must equal the Machine JWT machine when set.
  optional string machine_id = 2;
  string product_id = 3;
  SlotSelection slot = 4;
  string currency = 5;
  MachineRequestMeta meta = 6;
  optional SimulationContext simulation = 7;
}

message CreateOrderResponse {
  bool replay = 1;
  string order_id = 2;
  string vend_session_id = 3;
  string order_status = 4;
  string vend_state = 5;
  string slot_id = 6;
  string cabinet_code = 7;
  string slot_code = 8;
  int32 slot_index = 9;
  int64 subtotal_minor = 10;
  int64 tax_minor = 11;
  int64 total_minor = 12;
  int64 price_minor = 13;
  MachineResponseMeta meta = 14;
}

message QuoteLineInput {
  string product_id = 1;
  SlotSelection slot = 2;
  int32 quantity = 3;
}

message CreateQuoteRequest {
  IdempotencyContext context = 1;
  optional string machine_id = 2;
  string currency = 3;
  string payment_method = 4;
  repeated QuoteLineInput lines = 5;
  MachineRequestMeta meta = 6;
}

message QuoteLineResponse {
  int32 line_sequence = 1;
  string product_id = 2;
  string cabinet_code = 3;
  string slot_code = 4;
  int32 slot_index = 5;
  int32 quantity = 6;
  int64 unit_price_minor = 7;
  int64 line_subtotal_minor = 8;
  string pricing_fingerprint = 9;
}

message CreateQuoteResponse {
  bool replay = 1;
  string quote_id = 2;
  string currency = 3;
  string payment_method = 4;
  int64 subtotal_minor = 5;
  int64 discount_minor = 6;
  int64 payable_minor = 7;
  google.protobuf.Timestamp expires_at = 8;
  repeated QuoteLineResponse lines = 9;
  MachineResponseMeta meta = 10;
}

message CreateOrderFromQuoteRequest {
  IdempotencyContext context = 1;
  optional string machine_id = 2;
  string quote_id = 3;
  string payment_method = 4;
  MachineRequestMeta meta = 5;
  optional SimulationContext simulation = 6;
}

message OrderVendLineResponse {
  string vend_session_id = 1;
  int32 line_sequence = 2;
  int32 slot_index = 3;
  string product_id = 4;
  string cabinet_code = 5;
  string slot_code = 6;
  string vend_state = 7;
}

message CreateOrderFromQuoteResponse {
  bool replay = 1;
  string order_id = 2;
  string order_status = 3;
  string currency = 4;
  int64 subtotal_minor = 5;
  int64 tax_minor = 6;
  int64 total_minor = 7;
  repeated OrderVendLineResponse lines = 8;
  MachineResponseMeta meta = 9;
}

message CreatePaymentSessionRequest {
  IdempotencyContext context = 1;
  string order_id = 2;
  string provider = 3;
  // Defaults to "created" when empty (QR / PSP session).
  string payment_state = 4;
  int64 amount_minor = 5;
  string currency = 6;
  // JSON payload for outbox fan-out (e.g. PSP hints). Must be valid JSON when non-empty.
  string outbox_payload_json = 7;
  optional SimulationContext simulation = 8;
}

message CreatePaymentSessionResponse {
  bool replay = 1;
  string payment_id = 2;
  string payment_state = 3;
  int64 outbox_event_id = 4;
  // Opaque provider payload or HTTPS URL for QR presentation (never raw image bytes).
  string qr_payload_or_url = 5;
}

message ConfirmCashPaymentRequest {
  IdempotencyContext context = 1;
  string order_id = 2;
  optional SimulationContext simulation = 3;
}

message ConfirmCashPaymentResponse {
  bool replay = 1;
  string payment_id = 2;
  string order_status = 3;
  string payment_state = 4;
}

message GetOrderRequest {
  string order_id = 1;
  int32 slot_index = 2;
}

message GetOrderResponse {
  string order_id = 1;
  string order_status = 2;
  string currency = 3;
  int64 subtotal_minor = 4;
  int64 tax_minor = 5;
  int64 total_minor = 6;
  google.protobuf.Timestamp order_created_at = 7;
  string vend_state = 8;
  int32 vend_slot_index = 9;
  string product_id = 10;
  bool payment_present = 11;
  string payment_id = 12;
  string payment_provider = 13;
  string payment_state = 14;
}

message GetOrderStatusRequest {
  string order_id = 1;
  int32 slot_index = 2;
}

message GetOrderStatusResponse {
  string order_id = 1;
  string order_status = 2;
  string vend_state = 3;
  bool payment_present = 4;
  string payment_state = 5;
}

// HardwareCommandRef links a vend outcome to a command_ledger / machine_command_attempts row.
message HardwareCommandRef {
  string command_id = 1;
  // SHA-256 hex digest of canonical TX/RX wire bytes (preferred over raw_ref for payload size).
  string tx_rx_digest = 2;
  // Opaque reference to stored raw frame artifact when digest alone is insufficient.
  string raw_ref = 3;
}

// BillFinalRecord is the BILL acceptor final credit event for cash-only checkout.
message BillFinalRecord {
  string event_id = 1;
  int64 amount_minor = 2;
  string currency = 3;
  optional string raw_ref = 4;
}

// TcnDispenseRecord is the TCN board terminal dispense/drop outcome.
message TcnDispenseRecord {
  string slot = 1;
  string result = 2;
  bool dropped = 3;
  optional string digest = 4;
  optional string raw_ref = 5;
}

// VendHardwareEvidence correlates order, vend attempt, BILL final, TCN dispense, and command trace.
message VendHardwareEvidence {
  string vend_attempt_id = 1;
  string correlation_id = 2;
  HardwareCommandRef command = 3;
  BillFinalRecord bill_final = 4;
  TcnDispenseRecord tcn_dispense = 5;
}

message StartVendRequest {
  IdempotencyContext context = 1;
  string order_id = 2;
  int32 slot_index = 3;
  // When set, targets vend session by line_sequence (multi-cart). Falls back to slot_index when zero.
  int32 line_sequence = 4;
}

message StartVendResponse {
  bool replay = 1;
  string vend_state = 2;
  int32 slot_index = 3;
}

message ConfirmVendSuccessRequest {
  IdempotencyContext context = 1;
  string order_id = 2;
  int32 slot_index = 3;
  optional string correlation_id = 4;
  optional VendHardwareEvidence evidence = 5;
}

message ConfirmVendSuccessResponse {
  bool replay = 1;
  bool inventory_replay = 2;
  string order_id = 3;
  string order_status = 4;
  string vend_state = 5;
}

message ReportVendSuccessRequest {
  IdempotencyContext context = 1;
  string order_id = 2;
  int32 slot_index = 3;
  optional string correlation_id = 4;
  optional VendHardwareEvidence evidence = 5;
}

message ReportVendSuccessResponse {
  bool replay = 1;
  bool inventory_replay = 2;
  string order_id = 3;
  string order_status = 4;
  string vend_state = 5;
}

message ReportVendFailureRequest {
  IdempotencyContext context = 1;
  string order_id = 2;
  int32 slot_index = 3;
  string failure_reason = 4;
  optional string correlation_id = 5;
  optional VendHardwareEvidence evidence = 6;
}

message ReportVendFailureResponse {
  bool replay = 1;
  string order_id = 2;
  string order_status = 3;
  string vend_state = 4;
  bool local_cash_refund_required = 5;
  bool refund_required = 6;
}

message CancelOrderRequest {
  IdempotencyContext context = 1;
  string order_id = 2;
  string reason = 3;
}

message CancelOrderResponse {
  bool replay = 1;
  string order_id = 2;
  string order_status = 3;
}
