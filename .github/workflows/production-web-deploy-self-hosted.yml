name: Production Web Deploy Self-Hosted

# Deploy avf-vending-web to VPS B from the app-node A self-hosted runner.

on:
  workflow_dispatch:

concurrency:
  group: production-web-deploy-self-hosted
  cancel-in-progress: false

env:
  WEB_VPS_HOST: 187.127.99.153
  WEB_DEPLOY_ROOT: /opt/avf-vending-web
  WEB_REPO: leduytuanvu/avf-vending-web

jobs:
  deploy-web:
    name: Deploy web to VPS B
    runs-on: [self-hosted, Linux, X64, production, avf-prod-app-a]
    environment: production
    steps:
      - name: Install SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY || secrets.PROD_SSH_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_CONTENT: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS || vars.PRODUCTION_SSH_KNOWN_HOSTS || secrets.PROD_SSH_KNOWN_HOSTS || vars.PROD_SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || vars.PRODUCTION_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [[ -n "${SSH_KNOWN_HOSTS_CONTENT}" ]]; then
            printf '%s\n' "${SSH_KNOWN_HOSTS_CONTENT}" > ~/.ssh/known_hosts
          else
            touch ~/.ssh/known_hosts
          fi
          ssh-keyscan -H -p "${SSH_PORT}" "${{ env.WEB_VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts
          echo "SSH_PORT=${SSH_PORT}" >> "$GITHUB_ENV"

      - name: Clone web repo bundle
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/avf-vending-web-src
          git clone --depth 1 "https://x-access-token:${GHCR_PULL_TOKEN}@github.com/${{ env.WEB_REPO }}.git" /tmp/avf-vending-web-src

      - name: Sync deployment bundle
        run: |
          set -euo pipefail
          tar -C /tmp/avf-vending-web-src/deployments/production -cf - . | \
            ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "root@${{ env.WEB_VPS_HOST }}" \
              "mkdir -p '${{ env.WEB_DEPLOY_ROOT }}' && tar -xf - -C '${{ env.WEB_DEPLOY_ROOT }}'"
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "root@${{ env.WEB_VPS_HOST }}" \
            "chmod +x '${{ env.WEB_DEPLOY_ROOT }}/deploy-web.sh' '${{ env.WEB_DEPLOY_ROOT }}/rollback-web.sh' '${{ env.WEB_DEPLOY_ROOT }}/verify-web.sh'"

      - name: Capture current web container logs
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "root@${{ env.WEB_VPS_HOST }}" bash -s <<'REMOTE'
          set -euo pipefail
          if docker ps --format '{{.Names}}' | grep -qx avf-vending-web; then
            echo "=== web container env (AVF_API_BASE_URL) ==="
            docker exec avf-vending-web printenv AVF_API_BASE_URL 2>/dev/null || true
            echo "=== web container logs (orders / ApiError) ==="
            docker logs --tail=200 avf-vending-web 2>&1 | grep -Ei 'orders|ApiError|AVF API|AVF_API_BASE_URL|digest' || true
          else
            echo "web container avf-vending-web is not running"
          fi
          REMOTE

      - name: Build and deploy web on VPS B
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          PRODUCTION_DEPLOY_ROOT: ${{ secrets.PRODUCTION_DEPLOY_ROOT || secrets.DEPLOY_PATH || '/opt/avf-vending-api' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "root@${{ env.WEB_VPS_HOST }}" bash -s <<REMOTE
          set -euo pipefail
          cd /opt/avf-vending-web
          if [[ ! -f .env.production ]]; then
            cp .env.production.example .env.production
          fi
          app_env="${PRODUCTION_DEPLOY_ROOT}/deployments/prod/app-node/.env.app-node"
          compose_file="docker-compose.web-standalone-caddy.yml"
          if [[ -f "\${app_env}" ]] && docker compose --env-file "\${app_env}" -f "${PRODUCTION_DEPLOY_ROOT}/deployments/prod/app-node/docker-compose.app-node.yml" ps -q caddy 2>/dev/null | grep -q .; then
            project="\$(grep -E '^COMPOSE_PROJECT_NAME=' "\${app_env}" | tail -n1 | cut -d= -f2-)"
            project="\${project:-avf-vending-prod-app-b}"
            compose_file="docker-compose.web.yml"
            sed -i "s|^WEB_EDGE_NETWORK=.*|WEB_EDGE_NETWORK=\${project}_edge|" .env.production
            sed -i "s|^COMPOSE_FILE=.*|COMPOSE_FILE=\${compose_file}|" .env.production || echo "COMPOSE_FILE=\${compose_file}" >> .env.production
            if [[ -f "${PRODUCTION_DEPLOY_ROOT}/deployments/prod/shared/Caddyfile.with-admin" ]]; then
              grep -q '^ENABLE_ADMIN_VHOST=' "\${app_env}" && sed -i 's|^ENABLE_ADMIN_VHOST=.*|ENABLE_ADMIN_VHOST=1|' "\${app_env}" || echo 'ENABLE_ADMIN_VHOST=1' >> "\${app_env}"
              grep -q '^CADDYFILE_REL_PATH=' "\${app_env}" && sed -i 's|^CADDYFILE_REL_PATH=.*|CADDYFILE_REL_PATH=../shared/Caddyfile.with-admin|' "\${app_env}" || echo 'CADDYFILE_REL_PATH=../shared/Caddyfile.with-admin' >> "\${app_env}"
              grep -q '^ADMIN_DOMAIN=' "\${app_env}" || echo 'ADMIN_DOMAIN=admin.ldtv.dev' >> "\${app_env}"
              docker stop avf-vending-web-caddy 2>/dev/null || true
              docker rm avf-vending-web-caddy 2>/dev/null || true
            fi
            echo "integrated web mode (app-node Caddy owns 80/443, edge=\${project}_edge)"
          fi
          rm -rf /tmp/avf-vending-web-build
          git clone --depth 1 https://x-access-token:${GHCR_PULL_TOKEN}@github.com/${{ env.WEB_REPO }}.git /tmp/avf-vending-web-build
          cd /tmp/avf-vending-web-build
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL=https://admin.ldtv.dev \
            --build-arg APP_ENV=production \
            --build-arg AVF_API_BASE_URL=https://api.ldtv.dev \
            --build-arg AVF_OPENAPI_PATH=src/lib/api/generated/schema.ts \
            --build-arg NEXT_PUBLIC_ENABLE_MOCKS=false \
            --build-arg ENABLE_DEV_AUTH_MOCK=false \
            --build-arg SESSION_COOKIE_SECURE=true \
            -t avf-vending-web:deploy .
          sed -i "s|^WEB_IMAGE_REF=.*|WEB_IMAGE_REF=avf-vending-web:deploy|" /opt/avf-vending-web/.env.production
          cd /opt/avf-vending-web && COMPOSE_FILE="\${compose_file}" ./deploy-web.sh
          if [[ "\${compose_file}" == "docker-compose.web.yml" && -f "\${app_env}" ]]; then
            cd "${PRODUCTION_DEPLOY_ROOT}/deployments/prod/app-node"
            docker compose --env-file .env.app-node -f docker-compose.app-node.yml up -d --no-deps --force-recreate caddy
          fi
          REMOTE

      - name: Smoke check web health
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "root@${{ env.WEB_VPS_HOST }}" bash -s <<'REMOTE'
          set -euo pipefail
          for i in $(seq 1 12); do
            if docker exec avf-vending-web wget -qO- http://127.0.0.1:3000/api/health 2>/dev/null | grep -q '"status":"ok"'; then
              echo "PASS: web container health"
              exit 0
            fi
            sleep 5
          done
          docker logs --tail=80 avf-vending-web || true
          exit 1
          REMOTE
