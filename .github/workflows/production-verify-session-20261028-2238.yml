name: Production verify session 20261028 2238 cash orders

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-verify-session-20261028-2238-cash-orders
  cancel-in-progress: false

jobs:
  verify:
    name: Verify 2026-10-28 22:38 cash + orders
    runs-on: [self-hosted, Linux, X64, production, avf-prod-app-a]
    environment: production
    timeout-minutes: 15
    env:
      PRODUCTION_DEPLOY_ROOT: ${{ secrets.PRODUCTION_DEPLOY_ROOT || secrets.DEPLOY_PATH || '/opt/avf-vending-api' }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER || vars.PRODUCTION_SSH_USER || 'root' }}

    steps:
      - name: Configure privileged command helper
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          cat > /tmp/avf-prod-root.sh <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          if [[ "${1:-}" == "--setup" ]]; then
            if [[ "$(id -un)" == "${SSH_USER:-root}" ]]; then
              echo "PRIV_MODE=direct"
            elif sudo -n true 2>/dev/null; then
              echo "PRIV_MODE=sudo-nopass"
            elif [[ -n "${PRODUCTION_ROOT_PASSWORD:-}" ]]; then
              echo "PRIV_MODE=su-root"
            else
              echo "PRIV_MODE=none"
            fi
            exit 0
          fi
          cmd="$*"
          if [[ "$(id -un)" == "${SSH_USER:-root}" ]]; then
            bash -lc "${cmd}"
          elif sudo -n true 2>/dev/null; then
            sudo bash -lc "${cmd}"
          elif [[ -n "${PRODUCTION_ROOT_PASSWORD:-}" ]]; then
            printf '%s\n' "${PRODUCTION_ROOT_PASSWORD}" | su - "${SSH_USER:-root}" -c "${cmd}"
          else
            echo "error: privileged command required but no root credentials are available" >&2
            exit 1
          fi
          EOF
          chmod +x /tmp/avf-prod-root.sh
          SSH_USER="${SSH_USER}" PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-root.sh --setup >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify session 2026-10-28 22:38 cash orders
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          script="${GITHUB_WORKSPACE}/scripts/ops/verify_session_20261028_2238_cash_orders.sh"
          deploy_script="${PRODUCTION_DEPLOY_ROOT}/scripts/ops/verify_session_20261028_2238_cash_orders.sh"
          run_verify() {
            if [[ -f "${script}" ]]; then
              bash "${script}"
            elif [[ -f "${deploy_script}" ]]; then
              bash "${deploy_script}"
            else
              echo "error: verify_session_20261028_2238_cash_orders.sh not found" >&2
              exit 1
            fi
          }
          if [[ "${PRIV_MODE:-none}" != "none" ]]; then
            PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" SSH_USER="${SSH_USER}" /tmp/avf-prod-root.sh \
              "cd '${GITHUB_WORKSPACE}' && \
              if [[ -f '${script}' ]]; then bash '${script}'; \
              elif [[ -f '${deploy_script}' ]]; then bash '${deploy_script}'; \
              else echo 'error: script not found' >&2; exit 1; fi" \
              | tee verify-session-20261028-2238.log
          elif docker info >/dev/null 2>&1; then
            run_verify | tee verify-session-20261028-2238.log
          else
            echo "error: docker unavailable and no root credentials" >&2
            exit 1
          fi

      - name: Upload verify log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-session-20261028-2238-${{ github.run_id }}
          path: verify-session-20261028-2238.log
          if-no-files-found: ignore
