name: Production enable QR and 5m snapshots

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      machine_code:
        description: "Machine code to configure (default AVF000195 field unit)"
        required: false
        default: "AVF000195"
        type: string
      machine_id:
        description: "Machine UUID fallback when code lookup misses (field unit AVF000195)"
        required: false
        default: "019fb731-6eec-725c-9179-6201a99c09f7"
        type: string
      device_serial:
        description: "Device serial fallback lookup (field unit 0OVP8AYEFQ)"
        required: false
        default: "0OVP8AYEFQ"
        type: string

permissions:
  contents: read

concurrency:
  group: production-enable-qr-snapshot
  cancel-in-progress: false

jobs:
  configure:
    name: Enable live QR rails and periodic snapshot flag
    runs-on: [self-hosted, Linux, X64, production, avf-prod-app-a]
    environment: production
    timeout-minutes: 15
    env:
      BASE_URL: https://api.ldtv.dev
      MACHINE_CODE: ${{ inputs.machine_code }}
      MACHINE_ID: ${{ inputs.machine_id }}
      DEVICE_SERIAL: ${{ inputs.device_serial }}
      FORCE_DB: "1"
      E2E_OUTPUT_DIR: /tmp/avf-production-enable-qr-snapshot
      ADMIN_USERNAME: ${{ secrets.E2E_PROD_ADMIN_USERNAME || vars.E2E_PROD_ADMIN_USERNAME || 'admin' }}
      ADMIN_PASSWORD: ${{ secrets.E2E_PROD_ADMIN_PASSWORD }}
      E2E_PROD_ADMIN_USERNAME: ${{ secrets.E2E_PROD_ADMIN_USERNAME || vars.E2E_PROD_ADMIN_USERNAME || 'admin' }}
      E2E_PROD_ADMIN_PASSWORD: ${{ secrets.E2E_PROD_ADMIN_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.E2E_PROD_ADMIN_EMAIL }}
      E2E_PROD_ADMIN_EMAIL: ${{ secrets.E2E_PROD_ADMIN_EMAIL }}
      PRODUCTION_DEPLOY_ROOT: ${{ secrets.PRODUCTION_DEPLOY_ROOT || secrets.DEPLOY_PATH || '/opt/avf-vending-api' }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER || vars.PRODUCTION_SSH_USER || 'root' }}

    steps:
      - name: Configure privileged command helper
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          cat > /tmp/avf-prod-root.sh <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          if [[ "${1:-}" == "--setup" ]]; then
            if [[ "$(id -un)" == "${SSH_USER:-root}" ]]; then
              echo "PRIV_MODE=direct"
            elif sudo -n true 2>/dev/null; then
              echo "PRIV_MODE=sudo-nopass"
            elif [[ -n "${PRODUCTION_ROOT_PASSWORD:-}" ]]; then
              echo "PRIV_MODE=su-root"
            else
              echo "PRIV_MODE=none"
            fi
            exit 0
          fi
          cmd="$*"
          if [[ "$(id -un)" == "${SSH_USER:-root}" ]]; then
            bash -lc "${cmd}"
          elif sudo -n true 2>/dev/null; then
            sudo bash -lc "${cmd}"
          elif [[ -n "${PRODUCTION_ROOT_PASSWORD:-}" ]]; then
            printf '%s\n' "${PRODUCTION_ROOT_PASSWORD}" | su - "${SSH_USER:-root}" -c "${cmd}"
          else
            echo "error: privileged command required but no root credentials are available" >&2
            exit 1
          fi
          EOF
          chmod +x /tmp/avf-prod-root.sh
          SSH_USER="${SSH_USER}" PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-root.sh --setup >> "$GITHUB_ENV"

      - name: Clean stale root-owned workspace artifacts
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          stale="${GITHUB_WORKSPACE}/reports/e2e/production-enable-qr-snapshot"
          if [[ ! -e "${stale}" ]]; then
            echo "no stale workspace artifacts at ${stale}"
            exit 0
          fi
          echo "removing stale root-owned path ${stale}"
          if [[ "${PRIV_MODE:-none}" != "none" ]]; then
            PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" SSH_USER="${SSH_USER}" /tmp/avf-prod-root.sh \
              "rm -rf '${stale}'"
          else
            rm -rf "${stale}"
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Configure machine payment methods and snapshot flag
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          deploy_root="${PRODUCTION_DEPLOY_ROOT}"
          script="${deploy_root}/scripts/ops/enable_production_qr_and_snapshot.sh"
          checkout_script="${GITHUB_WORKSPACE}/scripts/ops/enable_production_qr_and_snapshot.sh"

          run_enable() {
            if [[ -f "${script}" ]]; then
              bash "${script}"
            elif [[ -f "${checkout_script}" ]]; then
              bash "${checkout_script}"
            else
              echo "error: enable_production_qr_and_snapshot.sh not found" >&2
              exit 1
            fi
          }

          if [[ "${PRIV_MODE:-none}" != "none" ]]; then
            PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" SSH_USER="${SSH_USER}" /tmp/avf-prod-root.sh \
              "cd '${GITHUB_WORKSPACE}' && export BASE_URL='${BASE_URL}' MACHINE_CODE='${MACHINE_CODE}' MACHINE_ID='${MACHINE_ID}' DEVICE_SERIAL='${DEVICE_SERIAL}' FORCE_DB='${FORCE_DB}' E2E_OUTPUT_DIR='${E2E_OUTPUT_DIR}' && \
              if [[ -f '${script}' ]]; then bash '${script}'; elif [[ -f '${checkout_script}' ]]; then bash '${checkout_script}'; else echo 'error: enable_production_qr_and_snapshot.sh not found' >&2; exit 1; fi" \
              | tee enable-qr-snapshot.log
          elif docker info >/dev/null 2>&1; then
            run_enable | tee enable-qr-snapshot.log
          else
            echo "error: no root credentials (set PRODUCTION_ROOT_PASSWORD on environment production) and docker is unavailable to github-runner" >&2
            exit 1
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enable-qr-snapshot-log
          path: enable-qr-snapshot.log
          retention-days: 14
