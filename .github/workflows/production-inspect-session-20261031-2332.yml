name: Production inspect session 20261031 2332 orders

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-inspect-session-20261031-2332-orders
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect 2026-10-31 23:32 orders
    runs-on: [self-hosted, Linux, X64, production, avf-prod-app-a]
    environment: production
    timeout-minutes: 10
    env:
      PRODUCTION_DEPLOY_ROOT: ${{ secrets.PRODUCTION_DEPLOY_ROOT || secrets.DEPLOY_PATH || '/opt/avf-vending-api' }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER || vars.PRODUCTION_SSH_USER || 'root' }}

    steps:
      - name: Configure privileged command helper
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          cat > /tmp/avf-prod-root.sh <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          if [[ "${1:-}" == "--setup" ]]; then
            if [[ "$(id -un)" == "${SSH_USER:-root}" ]]; then
              echo "PRIV_MODE=direct"
            elif sudo -n true 2>/dev/null; then
              echo "PRIV_MODE=sudo-nopass"
            elif [[ -n "${PRODUCTION_ROOT_PASSWORD:-}" ]]; then
              echo "PRIV_MODE=su-root"
            else
              echo "PRIV_MODE=none"
            fi
            exit 0
          fi
          cmd="$*"
          if [[ "$(id -un)" == "${SSH_USER:-root}" ]]; then
            bash -lc "${cmd}"
          elif sudo -n true 2>/dev/null; then
            sudo bash -lc "${cmd}"
          elif [[ -n "${PRODUCTION_ROOT_PASSWORD:-}" ]]; then
            printf '%s\n' "${PRODUCTION_ROOT_PASSWORD}" | su - "${SSH_USER:-root}" -c "${cmd}"
          else
            echo "error: privileged command required but no root credentials are available" >&2
            exit 1
          fi
          EOF
          chmod +x /tmp/avf-prod-root.sh
          SSH_USER="${SSH_USER}" PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-root.sh --setup >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Inspect session 2026-10-31 23:32 orders
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          script="${GITHUB_WORKSPACE}/scripts/ops/inspect_session_20261031_2332_orders.sh"
          deploy_script="${PRODUCTION_DEPLOY_ROOT}/scripts/ops/inspect_session_20261031_2332_orders.sh"
          run_inspect() {
            if [[ -f "${script}" ]]; then
              bash "${script}"
            elif [[ -f "${deploy_script}" ]]; then
              bash "${deploy_script}"
            else
              echo "error: inspect_session_20261031_2332_orders.sh not found" >&2
              exit 1
            fi
          }
          if [[ "${PRIV_MODE:-none}" != "none" ]]; then
            PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" SSH_USER="${SSH_USER}" /tmp/avf-prod-root.sh \
              "cd '${GITHUB_WORKSPACE}' && \
              if [[ -f '${script}' ]]; then bash '${script}'; \
              elif [[ -f '${deploy_script}' ]]; then bash '${deploy_script}'; \
              else echo 'error: script not found' >&2; exit 1; fi" \
              | tee inspect-session-20261031-2332.log
          elif docker info >/dev/null 2>&1; then
            run_inspect | tee inspect-session-20261031-2332.log
          else
            echo "error: docker unavailable and no root credentials" >&2
            exit 1
          fi

      - name: Upload inspect log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inspect-session-20261031-2332-${{ github.run_id }}
          path: inspect-session-20261031-2332.log
          if-no-files-found: ignore
