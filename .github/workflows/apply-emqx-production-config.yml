name: Apply EMQX Production Config

on:
  workflow_dispatch:
    inputs:
      install_acl:
        description: "Install EMQX ACL on data node and restart broker"
        required: false
        default: false
        type: boolean
      apply_app_node_env:
        description: "Apply EMQX management env on both app nodes"
        required: false
        default: true
        type: boolean
      open_management_from_app_nodes:
        description: "Bind EMQX :18083 off loopback, UFW-allow app-node IPs, recreate API to load env"
        required: false
        default: true
        type: boolean
      renew_mqtt_tls:
        description: "Renew/sync Let's Encrypt mqtt.ldtv.dev cert into EMQX and restart broker"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply-emqx-config:
    runs-on: [self-hosted, Linux, X64, production, avf-prod-app-a]
    environment: production
    env:
      PRODUCTION_DEPLOY_ROOT: ${{ secrets.PRODUCTION_DEPLOY_ROOT || secrets.DEPLOY_PATH || '/opt/avf-vending-api' }}
      APP_NODE_A_HOST: ${{ secrets.PRODUCTION_APP_NODE_A_HOST }}
      APP_NODE_B_HOST: ${{ secrets.PRODUCTION_APP_NODE_B_HOST }}
      DATA_NODE_HOST: ${{ secrets.PRODUCTION_DATA_NODE_HOST }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      EMQX_MANAGEMENT_URL: ${{ vars.EMQX_MANAGEMENT_URL || 'http://187.127.99.153:18083' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure SSH
        shell: bash
        env:
          SSH_KNOWN_HOSTS_CONTENT: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          identity_file="${HOME}/.ssh/production_deploy_key"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${identity_file}"
          chmod 600 "${identity_file}"
          printf '%s\n' "${SSH_KNOWN_HOSTS_CONTENT}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          {
            echo "SSH_OPTS=-o BatchMode=yes -o IdentitiesOnly=yes -i ${identity_file} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${HOME}/.ssh/known_hosts"
          } >> "$GITHUB_ENV"

      - name: Pin SSH host key for EMQX data host
        shell: bash
        run: |
          set -Eeuo pipefail
          EMQX_DATA_HOST="${DATA_NODE_HOST:-${APP_NODE_B_HOST:-}}"
          [[ -n "${EMQX_DATA_HOST}" ]] || {
            echo "error: DATA_NODE_HOST or APP_NODE_B_HOST is required" >&2
            exit 1
          }
          echo "EMQX_DATA_HOST=${EMQX_DATA_HOST}" >> "$GITHUB_ENV"
          if ! ssh-keygen -F "${EMQX_DATA_HOST}" -f "${HOME}/.ssh/known_hosts" >/dev/null \
            && ! ssh-keygen -F "[${EMQX_DATA_HOST}]:${SSH_PORT}" -f "${HOME}/.ssh/known_hosts" >/dev/null; then
            echo "Pinning SSH host key for EMQX data host ${EMQX_DATA_HOST}:${SSH_PORT}"
            ssh-keyscan -H -p "${SSH_PORT}" "${EMQX_DATA_HOST}" >> "${HOME}/.ssh/known_hosts"
          fi

      - name: Probe EMQX management from API (before)
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x deployments/prod/shared/scripts/probe_emqx_management_from_api.sh
          EMQX_PROBE_REQUIRE_OK=0 \
            APP_NODE_ENV_FILE="${PRODUCTION_DEPLOY_ROOT}/deployments/prod/app-node/.env.app-node" \
            APP_NODE_COMPOSE_FILE="${PRODUCTION_DEPLOY_ROOT}/deployments/prod/app-node/docker-compose.app-node.yml" \
            bash deployments/prod/shared/scripts/probe_emqx_management_from_api.sh || true

      - name: Sync EMQX management scripts to data node
        if: inputs.open_management_from_app_nodes || inputs.install_acl || inputs.renew_mqtt_tls
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${SSH_USER}@${EMQX_DATA_HOST}"
          read -r -a ssh_opts <<< "${SSH_OPTS}"
          ssh "${ssh_opts[@]}" -p "${SSH_PORT}" "${target}" "mkdir -p '${PRODUCTION_DEPLOY_ROOT}'"
          tar -cf - deployments/prod/data-node deployments/prod/emqx deployments/prod/shared deployments/prod/docker-compose.prod.yml | \
            ssh "${ssh_opts[@]}" -p "${SSH_PORT}" "${target}" "tar -xf - -C '${PRODUCTION_DEPLOY_ROOT}' && chmod +x \
              '${PRODUCTION_DEPLOY_ROOT}/deployments/prod/data-node/scripts/install_emqx_acl.sh' \
              '${PRODUCTION_DEPLOY_ROOT}/deployments/prod/data-node/scripts/renew_emqx_mqtt_tls.sh' \
              '${PRODUCTION_DEPLOY_ROOT}/deployments/prod/data-node/scripts/open_emqx_management_from_app_nodes.sh' \
              '${PRODUCTION_DEPLOY_ROOT}/deployments/prod/shared/scripts/probe_emqx_management_from_api.sh' \
              '${PRODUCTION_DEPLOY_ROOT}/deployments/prod/shared/scripts/reload_app_node_emqx_env.sh'"

      - name: Open EMQX management from app nodes
        if: inputs.open_management_from_app_nodes
        id: open_mgmt
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${SSH_USER}@${EMQX_DATA_HOST}"
          read -r -a ssh_opts <<< "${SSH_OPTS}"
          output="$(
            ssh "${ssh_opts[@]}" -p "${SSH_PORT}" "${target}" env \
              "APP_NODE_A_HOST=${APP_NODE_A_HOST}" \
              "APP_NODE_B_HOST=${APP_NODE_B_HOST:-}" \
              "DATA_NODE_PUBLIC_HOST=${EMQX_DATA_HOST}" \
              bash "${PRODUCTION_DEPLOY_ROOT}/deployments/prod/data-node/scripts/open_emqx_management_from_app_nodes.sh"
          )"
          printf '%s\n' "${output}"
          effective="$(printf '%s\n' "${output}" | awk -F= '/^EMQX_MANAGEMENT_URL_EFFECTIVE=/{print $2}' | tail -n 1)"
          [[ -n "${effective}" ]] || {
            echo "error: open script did not print EMQX_MANAGEMENT_URL_EFFECTIVE" >&2
            exit 1
          }
          echo "effective_url=${effective}" >> "$GITHUB_OUTPUT"
          echo "EMQX_MANAGEMENT_URL=${effective}" >> "$GITHUB_ENV"

      - name: Apply EMQX management env on app nodes
        if: inputs.apply_app_node_env
        shell: bash
        run: |
          set -Eeuo pipefail
          read -r -a ssh_opts <<< "${SSH_OPTS}"
          data_env="${PRODUCTION_DEPLOY_ROOT}/deployments/prod/data-node/.env.data-node"
          EMQX_API_KEY="$(
            ssh "${ssh_opts[@]}" -p "${SSH_PORT}" "${SSH_USER}@${EMQX_DATA_HOST}" \
              "grep -E '^EMQX_API_KEY=' '${data_env}' | tail -n 1 | cut -d= -f2-"
          )"
          EMQX_API_SECRET="$(
            ssh "${ssh_opts[@]}" -p "${SSH_PORT}" "${SSH_USER}@${EMQX_DATA_HOST}" \
              "grep -E '^EMQX_API_SECRET=' '${data_env}' | tail -n 1 | cut -d= -f2-"
          )"
          [[ -n "${EMQX_API_KEY}" && -n "${EMQX_API_SECRET}" ]] || {
            echo "error: EMQX_API_KEY / EMQX_API_SECRET missing in data-node env" >&2
            exit 1
          }
          apply_remote() {
            local host="$1"
            [[ -n "${host}" ]] || return 0
            local env_path="${PRODUCTION_DEPLOY_ROOT}/deployments/prod/app-node/.env.app-node"
            if ! ssh "${ssh_opts[@]}" -p "${SSH_PORT}" "${SSH_USER}@${host}" "test -f '${env_path}'"; then
              echo "skip apply EMQX env on ${host}: ${env_path} missing"
              return 0
            fi
            ssh "${ssh_opts[@]}" -p "${SSH_PORT}" "${SSH_USER}@${host}" env \
              "EMQX_MANAGEMENT_URL=${EMQX_MANAGEMENT_URL}" \
              "EMQX_API_KEY=${EMQX_API_KEY}" \
              "EMQX_API_SECRET=${EMQX_API_SECRET}" \
              "APP_NODE_ENV_FILE=${env_path}" \
              bash "${PRODUCTION_DEPLOY_ROOT}/deployments/prod/shared/scripts/apply_emqx_management_app_node_env.sh" "${env_path}"
          }
          apply_remote "${APP_NODE_A_HOST}"
          apply_remote "${APP_NODE_B_HOST:-}"

      - name: Recreate app-node services to load EMQX env
        if: inputs.apply_app_node_env || inputs.open_management_from_app_nodes
        shell: bash
        run: |
          set -Eeuo pipefail
          read -r -a ssh_opts <<< "${SSH_OPTS}"
          reload_remote() {
            local host="$1"
            [[ -n "${host}" ]] || return 0
            local env_path="${PRODUCTION_DEPLOY_ROOT}/deployments/prod/app-node/.env.app-node"
            local script_path="${PRODUCTION_DEPLOY_ROOT}/deployments/prod/shared/scripts/reload_app_node_emqx_env.sh"
            if ! ssh "${ssh_opts[@]}" -p "${SSH_PORT}" "${SSH_USER}@${host}" "test -f '${env_path}' && test -f '${script_path}'"; then
              echo "skip API recreate on ${host}: app-node env or reload script missing"
              return 0
            fi
            ssh "${ssh_opts[@]}" -p "${SSH_PORT}" "${SSH_USER}@${host}" env \
              "APP_NODE_ENV_FILE=${env_path}" \
              "APP_NODE_COMPOSE_FILE=${PRODUCTION_DEPLOY_ROOT}/deployments/prod/app-node/docker-compose.app-node.yml" \
              bash "${script_path}"
          }
          chmod +x deployments/prod/shared/scripts/reload_app_node_emqx_env.sh
          APP_NODE_ENV_FILE="${PRODUCTION_DEPLOY_ROOT}/deployments/prod/app-node/.env.app-node" \
            APP_NODE_COMPOSE_FILE="${PRODUCTION_DEPLOY_ROOT}/deployments/prod/app-node/docker-compose.app-node.yml" \
            bash deployments/prod/shared/scripts/reload_app_node_emqx_env.sh
          reload_remote "${APP_NODE_B_HOST:-}"

      - name: Probe EMQX management from API (after)
        if: inputs.open_management_from_app_nodes || inputs.apply_app_node_env
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x deployments/prod/shared/scripts/probe_emqx_management_from_api.sh
          EMQX_PROBE_REQUIRE_OK=1 \
            APP_NODE_ENV_FILE="${PRODUCTION_DEPLOY_ROOT}/deployments/prod/app-node/.env.app-node" \
            APP_NODE_COMPOSE_FILE="${PRODUCTION_DEPLOY_ROOT}/deployments/prod/app-node/docker-compose.app-node.yml" \
            bash deployments/prod/shared/scripts/probe_emqx_management_from_api.sh

      - name: Install EMQX ACL on data node
        if: inputs.install_acl
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${SSH_USER}@${EMQX_DATA_HOST}"
          read -r -a ssh_opts <<< "${SSH_OPTS}"
          ssh "${ssh_opts[@]}" -p "${SSH_PORT}" "${target}" \
            bash "${PRODUCTION_DEPLOY_ROOT}/deployments/prod/data-node/scripts/install_emqx_acl.sh"

      - name: Renew EMQX MQTT TLS from Let's Encrypt
        if: inputs.renew_mqtt_tls
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${SSH_USER}@${EMQX_DATA_HOST}"
          read -r -a ssh_opts <<< "${SSH_OPTS}"
          ssh "${ssh_opts[@]}" -p "${SSH_PORT}" "${target}" \
            bash "${PRODUCTION_DEPLOY_ROOT}/deployments/prod/data-node/scripts/renew_emqx_mqtt_tls.sh"
