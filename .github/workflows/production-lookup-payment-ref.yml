name: Production lookup payment ref

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      momo_order_id:
        description: MoMo orderId (provider_reference)
        required: true
        type: string
      momo_trans_id:
        description: MoMo transId (optional)
        required: false
        default: ""
        type: string
      machine_code:
        description: Machine code filter (optional)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: production-lookup-payment-ref
  cancel-in-progress: false

jobs:
  lookup:
    name: Lookup payment ref
    runs-on: [self-hosted, Linux, X64, production, avf-prod-app-a]
    environment: production
    timeout-minutes: 10
    env:
      MOMO_ORDER_ID: ${{ inputs.momo_order_id }}
      MOMO_TRANS_ID: ${{ inputs.momo_trans_id }}
      MACHINE_CODE: ${{ inputs.machine_code }}
      PRODUCTION_DEPLOY_ROOT: ${{ secrets.PRODUCTION_DEPLOY_ROOT || secrets.DEPLOY_PATH || '/opt/avf-vending-api' }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER || vars.PRODUCTION_SSH_USER || 'root' }}

    steps:
      - name: Configure privileged command helper
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          cat > /tmp/avf-prod-root.sh <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          if [[ "${1:-}" == "--setup" ]]; then
            if [[ "$(id -un)" == "${SSH_USER:-root}" ]]; then
              echo "PRIV_MODE=direct"
            elif sudo -n true 2>/dev/null; then
              echo "PRIV_MODE=sudo-nopass"
            elif [[ -n "${PRODUCTION_ROOT_PASSWORD:-}" ]]; then
              echo "PRIV_MODE=su-root"
            else
              echo "PRIV_MODE=none"
            fi
            exit 0
          fi
          cmd="$*"
          if [[ "$(id -un)" == "${SSH_USER:-root}" ]]; then
            bash -lc "${cmd}"
          elif sudo -n true 2>/dev/null; then
            sudo bash -lc "${cmd}"
          elif [[ -n "${PRODUCTION_ROOT_PASSWORD:-}" ]]; then
            printf '%s\n' "${PRODUCTION_ROOT_PASSWORD}" | su - "${SSH_USER:-root}" -c "${cmd}"
          else
            echo "error: privileged command required but no root credentials are available" >&2
            exit 1
          fi
          EOF
          chmod +x /tmp/avf-prod-root.sh
          SSH_USER="${SSH_USER}" PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-root.sh --setup >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: DB lookup (read-only)
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          run_lookup() {
            MOMO_ORDER_ID="${MOMO_ORDER_ID}" MOMO_TRANS_ID="${MOMO_TRANS_ID}" MACHINE_CODE="${MACHINE_CODE}" \
              bash scripts/ops/lookup_payment_ref.sh
          }
          if [[ "${PRIV_MODE:-none}" != "none" ]]; then
            PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" SSH_USER="${SSH_USER}" /tmp/avf-prod-root.sh \
              "cd '${GITHUB_WORKSPACE}' && export MOMO_ORDER_ID='${MOMO_ORDER_ID}' MOMO_TRANS_ID='${MOMO_TRANS_ID}' MACHINE_CODE='${MACHINE_CODE}' && \
              bash scripts/ops/lookup_payment_ref.sh" | tee lookup-payment-ref.log
          else
            run_lookup | tee lookup-payment-ref.log
          fi
