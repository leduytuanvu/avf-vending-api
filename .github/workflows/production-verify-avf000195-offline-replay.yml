name: Production verify AVF000195 offline replay

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      min_cursor:
        description: "Expect offline last_sequence >= this (after align, usually minPending-1)"
        required: true
        default: "3"
        type: string
      require_orders:
        description: "Fail job if both test order IDs are not in orders table"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-verify-avf000195-offline-replay
  cancel-in-progress: false

jobs:
  verify:
    name: Verify AVF000195 offline replay
    runs-on: [self-hosted, Linux, X64, production, avf-prod-app-a]
    environment: production
    timeout-minutes: 10
    env:
      MIN_CURSOR: ${{ inputs.min_cursor }}
      REQUIRE_ORDERS: ${{ inputs.require_orders && '1' || '0' }}
      API_BASE: https://api.ldtv.dev
      PRODUCTION_DEPLOY_ROOT: ${{ secrets.PRODUCTION_DEPLOY_ROOT || secrets.DEPLOY_PATH || '/opt/avf-vending-api' }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER || vars.PRODUCTION_SSH_USER || 'root' }}
      ADMIN_USERNAME: ${{ secrets.E2E_PROD_ADMIN_USERNAME || vars.E2E_PROD_ADMIN_USERNAME || 'admin' }}
      ADMIN_PASSWORD: ${{ secrets.E2E_PROD_ADMIN_PASSWORD }}
      E2E_PROD_ADMIN_USERNAME: ${{ secrets.E2E_PROD_ADMIN_USERNAME || vars.E2E_PROD_ADMIN_USERNAME || 'admin' }}
      E2E_PROD_ADMIN_PASSWORD: ${{ secrets.E2E_PROD_ADMIN_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.E2E_PROD_ADMIN_EMAIL }}
      E2E_PROD_ADMIN_EMAIL: ${{ secrets.E2E_PROD_ADMIN_EMAIL }}

    steps:
      - name: Configure privileged command helper
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          cat > /tmp/avf-prod-root.sh <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          if [[ "${1:-}" == "--setup" ]]; then
            if [[ "$(id -un)" == "${SSH_USER:-root}" ]]; then
              echo "PRIV_MODE=direct"
            elif sudo -n true 2>/dev/null; then
              echo "PRIV_MODE=sudo-nopass"
            elif [[ -n "${PRODUCTION_ROOT_PASSWORD:-}" ]]; then
              echo "PRIV_MODE=su-root"
            else
              echo "PRIV_MODE=none"
            fi
            exit 0
          fi
          cmd="$*"
          if [[ "$(id -un)" == "${SSH_USER:-root}" ]]; then
            bash -lc "${cmd}"
          elif sudo -n true 2>/dev/null; then
            sudo bash -lc "${cmd}"
          elif [[ -n "${PRODUCTION_ROOT_PASSWORD:-}" ]]; then
            printf '%s\n' "${PRODUCTION_ROOT_PASSWORD}" | su - "${SSH_USER:-root}" -c "${cmd}"
          else
            echo "error: privileged command required but no root credentials are available" >&2
            exit 1
          fi
          EOF
          chmod +x /tmp/avf-prod-root.sh
          SSH_USER="${SSH_USER}" PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-root.sh --setup >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: DB verify (read-only)
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if [[ "${PRIV_MODE:-none}" != "none" ]]; then
            PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" SSH_USER="${SSH_USER}" /tmp/avf-prod-root.sh \
              "cd '${GITHUB_WORKSPACE}' && export MIN_CURSOR='${MIN_CURSOR}' REQUIRE_ORDERS='${REQUIRE_ORDERS}' && \
              bash scripts/ops/verify_avf000195_offline_replay.sh" \
              | tee verify-replay.log
          else
            MIN_CURSOR="${MIN_CURSOR}" REQUIRE_ORDERS="${REQUIRE_ORDERS}" \
              bash scripts/ops/verify_avf000195_offline_replay.sh | tee verify-replay.log
          fi

      - name: Admin API spot-check orders
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="${GITHUB_WORKSPACE}"
          # shellcheck source=scripts/e2e/lib/common.sh
          source "${ROOT}/scripts/e2e/lib/common.sh"
          export BASE_URL="${API_BASE}"
          e2e_init_run_dir "production-verify-avf000195-offline-replay"
          token="$(e2e_admin_token)" || {
            echo "warn: admin login failed (http=${E2E_ADMIN_AUTH_HTTP_CODE:-unknown})"
            exit 0
          }
          for oid in ffc489f5-0bcd-45f3-971a-ce709f7c2056 0a6984ee-7139-4d18-b943-9a843da0e6d3; do
            body="$(mktemp)"
            code="$(curl -sS -o "${body}" -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/json" \
              --connect-timeout 8 --max-time 20 \
              "${BASE_URL%/}/v1/admin/orders/${oid}")"
            echo "GET /v1/admin/orders/${oid} http=${code}"
            if [[ "${code}" == "200" ]]; then
              jq '{id,status,machine_id,total_minor,created_at}' "${body}"
            else
              head -c 500 "${body}" || true
            fi
            rm -f "${body}"
          done

      - name: Upload log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-avf000195-offline-replay-log
          path: verify-replay.log
          retention-days: 14
