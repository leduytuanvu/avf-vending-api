name: Production Self-Hosted Build Deploy

# Emergency path when GitHub-hosted ubuntu runners are unavailable.
# Builds digest-pinned images on app-node A, runs migration 00035+, rolls out locally.

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Must be exactly DEPLOY_PRODUCTION"
        required: true
        type: string
      run_migration:
        description: "Run production database migration before rollout"
        required: false
        default: true
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

concurrency:
  group: production-self-hosted-build-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build images and roll out on app-node A
    runs-on: [self-hosted, Linux, X64, production, avf-prod-app-a]
    environment: production
    env:
      PRODUCTION_DEPLOY_ROOT: ${{ secrets.PRODUCTION_DEPLOY_ROOT || secrets.DEPLOY_PATH || '/opt/avf-vending-api' }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER || vars.PRODUCTION_SSH_USER || 'root' }}
      RUN_MIGRATION: ${{ inputs.run_migration && '1' || '0' }}
    steps:
      - name: Validate confirmation
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${{ github.event.inputs.confirm_deploy }}" == "DEPLOY_PRODUCTION" ]] \
            || { echo "error: confirm_deploy must be DEPLOY_PRODUCTION"; exit 1; }

      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Configure privileged command helper
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          cat > /tmp/avf-prod-root.sh <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          if [[ "${1:-}" == "--setup" ]]; then
            if [[ "$(id -un)" == "${SSH_USER:-root}" ]]; then
              echo "PRIV_MODE=direct"
            elif sudo -n true 2>/dev/null; then
              echo "PRIV_MODE=sudo-nopass"
            elif [[ -n "${PRODUCTION_ROOT_PASSWORD:-}" ]]; then
              echo "PRIV_MODE=su-root"
            else
              echo "PRIV_MODE=none"
            fi
            exit 0
          fi
          cmd="$*"
          if [[ "$(id -un)" == "${SSH_USER:-root}" ]]; then
            bash -lc "${cmd}"
          elif sudo -n true 2>/dev/null; then
            sudo bash -lc "${cmd}"
          elif [[ -n "${PRODUCTION_ROOT_PASSWORD:-}" ]]; then
            printf '%s\n' "${PRODUCTION_ROOT_PASSWORD}" | su - "${SSH_USER:-root}" -c "${cmd}"
          else
            echo "error: privileged command required but no root credentials are available" >&2
            exit 1
          fi
          EOF
          chmod +x /tmp/avf-prod-root.sh
          SSH_USER="${SSH_USER}" PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-root.sh --setup >> "$GITHUB_ENV"

      - name: Install loopback SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY || secrets.PROD_SSH_KEY || secrets.SSH_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_CONTENT: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS || vars.PRODUCTION_SSH_KNOWN_HOSTS || secrets.PROD_SSH_KNOWN_HOSTS || vars.PROD_SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || vars.PRODUCTION_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
          APP_NODE_A_HOST: ${{ secrets.PRODUCTION_APP_NODE_A_HOST || vars.PRODUCTION_APP_NODE_A_HOST }}
        run: |
          set -Eeuo pipefail
          [[ -n "${SSH_PRIVATE_KEY}" ]] || { echo "error: production SSH private key secret is required"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          identity_file="${HOME}/.ssh/production_deploy_key"
          printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' > "${identity_file}"
          chmod 600 "${identity_file}"
          if [[ -n "${SSH_KNOWN_HOSTS_CONTENT}" ]]; then
            printf '%s\n' "${SSH_KNOWN_HOSTS_CONTENT}" > ~/.ssh/known_hosts
          else
            touch ~/.ssh/known_hosts
          fi
          public_host="${APP_NODE_A_HOST:-}"
          ssh-keyscan -T 10 -p "${SSH_PORT}" -t ed25519,ecdsa,rsa 127.0.0.1 >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -T 10 -p "${SSH_PORT}" -H -t ed25519,ecdsa,rsa 127.0.0.1 >> ~/.ssh/known_hosts 2>/dev/null || true
          if [[ -n "${public_host}" ]] && ! ssh-keygen -F "127.0.0.1" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
            grep -F "${public_host}" ~/.ssh/known_hosts | sed "s/${public_host}/127.0.0.1/g" >> ~/.ssh/known_hosts || true
            grep -F "[${public_host}]:${SSH_PORT}" ~/.ssh/known_hosts | sed "s/${public_host}/127.0.0.1/g" >> ~/.ssh/known_hosts || true
          fi
          chmod 600 ~/.ssh/known_hosts
          echo "SSH_IDENTITY_FILE=${identity_file}" >> "$GITHUB_ENV"
          echo "SSH_PORT=${SSH_PORT}" >> "$GITHUB_ENV"

      - name: Ensure loopback SSH access
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if docker info >/dev/null 2>&1 || sg docker -c "docker info" >/dev/null 2>&1; then
            echo "docker runtime available to runner session"
            exit 0
          fi
          if ssh -o BatchMode=yes -o ConnectTimeout=10 -i "${SSH_IDENTITY_FILE}" -p "${SSH_PORT}" "${SSH_USER}@127.0.0.1" true 2>/dev/null; then
            echo "loopback SSH is ready"
            exit 0
          fi
          if [[ "${PRIV_MODE:-none}" != "none" ]]; then
            chmod +x scripts/deploy/recover_loopback_ssh.sh
            PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" PRIV_HELPER=/tmp/avf-prod-root.sh \
              SSH_IDENTITY_FILE="${SSH_IDENTITY_FILE}" SSH_USER="${SSH_USER}" SSH_PORT="${SSH_PORT}" \
              bash scripts/deploy/recover_loopback_ssh.sh
          fi
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i "${SSH_IDENTITY_FILE}" -p "${SSH_PORT}" "${SSH_USER}@127.0.0.1" true

      - name: Build and push production images
        id: build
        shell: bash
        env:
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          docker_cmd() {
            if docker info >/dev/null 2>&1; then
              docker "$@"
            elif sg docker -c "docker info" >/dev/null 2>&1; then
              sg docker -c "docker $*"
            elif [[ "${PRIV_MODE:-none}" != "none" ]]; then
              PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD:-}" SSH_USER="${SSH_USER}" /tmp/avf-prod-root.sh "docker $*"
            else
              ssh -o BatchMode=yes -i "${SSH_IDENTITY_FILE}" -p "${SSH_PORT}" "${SSH_USER}@127.0.0.1" "docker $*"
            fi
          }
          docker_stream() {
            if docker info >/dev/null 2>&1; then
              docker "$@"
            elif sg docker -c "docker info" >/dev/null 2>&1; then
              sg docker -c "docker $*"
            elif [[ "${PRIV_MODE:-none}" != "none" ]]; then
              PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD:-}" SSH_USER="${SSH_USER}" /tmp/avf-prod-root.sh "docker $*"
            else
              ssh -o BatchMode=yes -i "${SSH_IDENTITY_FILE}" -p "${SSH_PORT}" "${SSH_USER}@127.0.0.1" "docker $*"
            fi
          }
          run_root() {
            if [[ "${PRIV_MODE:-none}" != "none" ]]; then
              PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD:-}" SSH_USER="${SSH_USER}" /tmp/avf-prod-root.sh "$@"
            elif docker info >/dev/null 2>&1; then
              bash -lc "$*"
            elif sg docker -c "docker info" >/dev/null 2>&1; then
              bash -lc "$*"
            else
              ssh -o BatchMode=yes -i "${SSH_IDENTITY_FILE}" -p "${SSH_PORT}" "${SSH_USER}@127.0.0.1" "$@"
            fi
          }
          git_sha="$(git rev-parse HEAD)"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          app_image="ghcr.io/${repo}"
          goose_image="ghcr.io/${repo}-goose"
          app_tag="${app_image}:main-${git_sha}"
          goose_tag="${goose_image}:main-${git_sha}"
          build_dir="/tmp/avf-vending-api-build-${git_sha}"

          token="${GHCR_PULL_TOKEN:-${{ secrets.GITHUB_TOKEN }}}"
          user="${GHCR_PULL_USERNAME:-${{ github.repository_owner }}}"

          if docker info >/dev/null 2>&1 || sg docker -c "docker info" >/dev/null 2>&1; then
            echo "${token}" | docker_cmd login ghcr.io -u "${user}" --password-stdin
            docker_cmd build \
              -f deployments/prod/Dockerfile \
              --build-arg "GIT_SHA=${git_sha}" \
              --build-arg "BUILD_TIME=${build_time}" \
              -t "${app_tag}" \
              -t "${app_image}:main" \
              .
            docker_cmd build \
              -f deployments/prod/Dockerfile.goose \
              -t "${goose_tag}" \
              -t "${goose_image}:main" \
              .
            docker_cmd push "${app_tag}"
            docker_cmd push "${app_image}:main"
            docker_cmd push "${goose_tag}"
            docker_cmd push "${goose_image}:main"
            app_digest="$(docker_cmd inspect --format='{{index .RepoDigests 0}}' "${app_tag}" | cut -d@ -f2)"
            goose_digest="$(docker_cmd inspect --format='{{index .RepoDigests 0}}' "${goose_tag}" | cut -d@ -f2)"
          else
            tar -cf - -C "${GITHUB_WORKSPACE}" . | run_root "mkdir -p '${build_dir}' && tar -xf - -C '${build_dir}' --overwrite"
            run_root "echo '${token}' | docker login ghcr.io -u '${user}' --password-stdin"
            run_root "cd '${build_dir}' && docker build \
              -f deployments/prod/Dockerfile \
              --build-arg GIT_SHA='${git_sha}' \
              --build-arg BUILD_TIME='${build_time}' \
              -t '${app_tag}' \
              -t '${app_image}:main' \
              ."
            run_root "cd '${build_dir}' && docker build \
              -f deployments/prod/Dockerfile.goose \
              -t '${goose_tag}' \
              -t '${goose_image}:main' \
              ."
            run_root "docker push '${app_tag}'"
            run_root "docker push '${app_image}:main'"
            run_root "docker push '${goose_tag}'"
            run_root "docker push '${goose_image}:main'"
            app_digest="$(run_root "docker inspect --format='{{index .RepoDigests 0}}' '${app_tag}'" | cut -d@ -f2)"
            goose_digest="$(run_root "docker inspect --format='{{index .RepoDigests 0}}' '${goose_tag}'" | cut -d@ -f2)"
            run_root "rm -rf '${build_dir}'" || true
          fi

          app_ref="${app_tag}@${app_digest}"
          goose_ref="${goose_tag}@${goose_digest}"
          {
            echo "app_ref=${app_ref}"
            echo "goose_ref=${goose_ref}"
            echo "git_sha=${git_sha}"
          } >> "$GITHUB_OUTPUT"
          echo "Built ${app_ref}" >> "$GITHUB_STEP_SUMMARY"
          echo "Built ${goose_ref}" >> "$GITHUB_STEP_SUMMARY"

      - name: Sync app-node assets locally
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          run_root() {
            if [[ "${PRIV_MODE:-none}" != "none" ]]; then
              PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD:-}" SSH_USER="${SSH_USER}" /tmp/avf-prod-root.sh "$@"
            else
              ssh -o BatchMode=yes -i "${SSH_IDENTITY_FILE}" -p "${SSH_PORT}" "${SSH_USER}@127.0.0.1" "$@"
            fi
          }
          deploy_root="${PRODUCTION_DEPLOY_ROOT}"
          tar -cf - -C "${GITHUB_WORKSPACE}" \
            deployments/prod/app-node deployments/prod/shared deployments/prod/README.md migrations \
            scripts/deploy/production-migrate.sh scripts/verify_database_environment.sh scripts/db/verify_database_environment.sh | \
            run_root "mkdir -p '${deploy_root}' && tar -xf - -C '${deploy_root}' --overwrite && chmod +x \
              '${deploy_root}/scripts/deploy/production-migrate.sh' \
              '${deploy_root}/scripts/verify_database_environment.sh' \
              '${deploy_root}/scripts/db/verify_database_environment.sh'"

      - name: Roll out app node A locally
        shell: bash
        env:
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
          APP_IMAGE_REF: ${{ steps.build.outputs.app_ref }}
          GOOSE_IMAGE_REF: ${{ steps.build.outputs.goose_ref }}
        run: |
          set -Eeuo pipefail
          run_root() {
            if [[ "${PRIV_MODE:-none}" != "none" ]]; then
              PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD:-}" SSH_USER="${SSH_USER}" /tmp/avf-prod-root.sh "$@"
            else
              ssh -o BatchMode=yes -i "${SSH_IDENTITY_FILE}" -p "${SSH_PORT}" "${SSH_USER}@127.0.0.1" "$@"
            fi
          }
          remote_dir="${PRODUCTION_DEPLOY_ROOT}/deployments/prod/app-node"
          run_root "cd '${remote_dir}' && GHCR_PULL_USERNAME='${GHCR_PULL_USERNAME}' GHCR_PULL_TOKEN='${GHCR_PULL_TOKEN}' RUN_MIGRATION='${RUN_MIGRATION}' APP_NODE_ENABLE_TEMPORAL_PROFILE='0' bash scripts/release_app_node.sh '${APP_IMAGE_REF}' '${GOOSE_IMAGE_REF}'"

      - name: Verify app node A health locally
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          run_root() {
            if [[ "${PRIV_MODE:-none}" != "none" ]]; then
              PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD:-}" SSH_USER="${SSH_USER}" /tmp/avf-prod-root.sh "$@"
            else
              ssh -o BatchMode=yes -i "${SSH_IDENTITY_FILE}" -p "${SSH_PORT}" "${SSH_USER}@127.0.0.1" "$@"
            fi
          }
          remote_dir="${PRODUCTION_DEPLOY_ROOT}/deployments/prod/app-node"
          run_root "cd '${remote_dir}' && bash scripts/healthcheck_app_node.sh"

      - name: Public smoke check
        shell: bash
        env:
          BASE_URL: ${{ vars.PRODUCTION_PUBLIC_BASE_URL || secrets.PRODUCTION_PUBLIC_BASE_URL }}
        run: |
          set -Eeuo pipefail
          [[ -n "${BASE_URL}" ]] || BASE_URL="https://api.ldtv.dev"
          curl -fsS "${BASE_URL%/}/health/live" >/dev/null
          curl -fsS "${BASE_URL%/}/health/ready" >/dev/null
