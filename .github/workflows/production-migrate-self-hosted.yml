name: Production Migrate Self-Hosted

# Runs goose migration on app-node A via self-hosted runner (no full deploy-prod rollout).
on:
  workflow_dispatch:
    inputs:
      confirm_migration:
        description: "Must be exactly MIGRATE_PRODUCTION"
        required: true
        type: string
      verify_only:
        description: "Skip migration; only verify validation_status constraint"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: production-migrate-self-hosted
  cancel-in-progress: false

jobs:
  migrate-on-app-node:
    name: Migrate on app-node A
    runs-on: [self-hosted, Linux, X64, production, avf-prod-app-a]
    environment: production
    env:
      PRODUCTION_DEPLOY_ROOT: ${{ secrets.PRODUCTION_DEPLOY_ROOT || secrets.DEPLOY_PATH || '/opt/avf-vending-api' }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER || vars.PRODUCTION_SSH_USER || 'root' }}
    steps:
      - name: Validate confirmation
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${{ github.event.inputs.confirm_migration }}" == "MIGRATE_PRODUCTION" ]] \
            || { echo "error: confirm_migration must be MIGRATE_PRODUCTION"; exit 1; }

      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure privileged command helper
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          cat > /tmp/avf-prod-root.sh <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          if [[ "${1:-}" == "--setup" ]]; then
            if [[ "$(id -un)" == "${SSH_USER:-root}" ]]; then
              echo "PRIV_MODE=direct"
            elif sudo -n true 2>/dev/null; then
              echo "PRIV_MODE=sudo-nopass"
            elif [[ -n "${PRODUCTION_ROOT_PASSWORD:-}" ]]; then
              echo "PRIV_MODE=su-root"
            else
              echo "PRIV_MODE=none"
            fi
            exit 0
          fi
          cmd="$*"
          if [[ "$(id -un)" == "${SSH_USER:-root}" ]]; then
            bash -lc "${cmd}"
          elif sudo -n true 2>/dev/null; then
            sudo bash -lc "${cmd}"
          elif [[ -n "${PRODUCTION_ROOT_PASSWORD:-}" ]]; then
            printf '%s\n' "${PRODUCTION_ROOT_PASSWORD}" | su - "${SSH_USER:-root}" -c "${cmd}"
          else
            echo "error: privileged command required but no root credentials are available" >&2
            exit 1
          fi
          EOF
          chmod +x /tmp/avf-prod-root.sh
          SSH_USER="${SSH_USER}" PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-root.sh --setup >> "$GITHUB_ENV"

      - name: Sync migration scripts to deploy root
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          deploy_root="${PRODUCTION_DEPLOY_ROOT}"
          sync_tar="$(mktemp)"
          tar -cf "${sync_tar}" migrations \
            scripts/deploy/production-migrate.sh \
            scripts/verify_database_environment.sh \
            scripts/db/verify_database_environment.sh \
            scripts/ops/verify-production-payment-validation-status.sh
          PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" SSH_USER="${SSH_USER}" /tmp/avf-prod-root.sh \
            "mkdir -p '${deploy_root}' && tar -xf '${sync_tar}' -C '${deploy_root}' --overwrite && chmod +x \
              '${deploy_root}/scripts/deploy/production-migrate.sh' \
              '${deploy_root}/scripts/verify_database_environment.sh' \
              '${deploy_root}/scripts/db/verify_database_environment.sh' \
              '${deploy_root}/scripts/ops/verify-production-payment-validation-status.sh'"
          rm -f "${sync_tar}"

      - name: Log in to GHCR for image pull
        if: ${{ github.event.inputs.verify_only != true }}
        shell: bash
        env:
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ -n "${GHCR_PULL_USERNAME}" && -n "${GHCR_PULL_TOKEN}" ]] || {
            echo "error: GHCR_PULL_USERNAME / GHCR_PULL_TOKEN required for image pull" >&2
            exit 1
          }
          PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" SSH_USER="${SSH_USER}" /tmp/avf-prod-root.sh \
            "echo '${GHCR_PULL_TOKEN}' | docker login ghcr.io -u '${GHCR_PULL_USERNAME}' --password-stdin"

      - name: Run production migration
        if: ${{ github.event.inputs.verify_only != true }}
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          deploy_root="${PRODUCTION_DEPLOY_ROOT}"
          compose_file="${deploy_root}/deployments/prod/app-node/docker-compose.app-node.yml"
          env_file="${deploy_root}/deployments/prod/app-node/.env.app-node"
          PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" SSH_USER="${SSH_USER}" /tmp/avf-prod-root.sh \
            "set -Eeuo pipefail
             test -f '${compose_file}' && test -f '${env_file}'
             api_container=\$(docker ps --format '{{.Names}}' | grep -E 'api' | head -n1)
             database_url=\$(docker inspect \"\${api_container}\" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -E '^DATABASE_URL=' | tail -n1 | cut -d= -f2- | tr -d '\r')
             backup_url=\$(python3 - \"\${database_url}\" <<'PY'
          import sys
          from urllib.parse import parse_qsl, urlencode, urlparse, urlunparse
          u = urlparse(sys.argv[1])
          drop = {'default_query_exec_mode', 'pgbouncer'}
          q = [(k, v) for k, v in parse_qsl(u.query, keep_blank_values=True) if k not in drop]
          print(urlunparse((u.scheme, u.netloc, u.path, u.params, urlencode(q), u.fragment)))
          PY
          )
             cd '${deploy_root}' && GITHUB_ACTIONS=true DATABASE_URL=\"\${backup_url}\" BACKUP_DATABASE_URL=\"\${backup_url}\" bash scripts/deploy/production-migrate.sh \
               --compose-file '${compose_file}' \
               --env-file '${env_file}'"

      - name: Verify payment validation_status constraint
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          deploy_root="${PRODUCTION_DEPLOY_ROOT}"
          PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" SSH_USER="${SSH_USER}" /tmp/avf-prod-root.sh \
            "cd '${deploy_root}' && bash scripts/ops/verify-production-payment-validation-status.sh"

      - name: Public health check
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS https://api.ldtv.dev/health/live
          curl -fsS https://api.ldtv.dev/health/ready
          curl -fsS https://api.ldtv.dev/version
