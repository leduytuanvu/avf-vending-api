name: Production SSH Recover and Local Deploy

on:
  workflow_dispatch:
    inputs:
      app_image_ref:
        description: "Digest-pinned app image ref (...@sha256:...)"
        required: true
        type: string
      goose_image_ref:
        description: "Digest-pinned goose image ref (...@sha256:...)"
        required: true
        type: string
      run_migration:
        description: "Run production database migration on app node A"
        required: false
        default: true
        type: boolean
      recover_sshd_only:
        description: "Only recover SSH; skip local deploy rollout"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  recover-and-deploy:
    runs-on: [self-hosted, Linux, X64, production, avf-prod-app-a]
    environment: production
    env:
      PRODUCTION_DEPLOY_ROOT: ${{ secrets.PRODUCTION_DEPLOY_ROOT || secrets.DEPLOY_PATH || '/opt/avf-vending-api' }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || vars.PRODUCTION_SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER || vars.PRODUCTION_SSH_USER || 'root' }}
      APP_IMAGE_REF: ${{ inputs.app_image_ref }}
      GOOSE_IMAGE_REF: ${{ inputs.goose_image_ref }}
      RUN_MIGRATION: ${{ inputs.run_migration && '1' || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure privileged command helper
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          cat > /tmp/avf-prod-sudo.sh <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          if [[ "${1:-}" == "--setup" ]]; then
            if sudo -n true 2>/dev/null; then
              echo "SUDO_MODE=passwordless"
            elif [[ -n "${PRODUCTION_ROOT_PASSWORD:-}" ]]; then
              echo "SUDO_MODE=password"
            else
              echo "SUDO_MODE=none"
            fi
            exit 0
          fi
          if sudo -n true 2>/dev/null; then
            sudo "$@"
          elif [[ -n "${PRODUCTION_ROOT_PASSWORD:-}" ]]; then
            printf '%s\n' "${PRODUCTION_ROOT_PASSWORD}" | sudo -S "$@"
          else
            echo "error: privileged command required but neither passwordless sudo nor PRODUCTION_ROOT_PASSWORD is available" >&2
            exit 1
          fi
          EOF
          chmod +x /tmp/avf-prod-sudo.sh
          PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh --setup >> "$GITHUB_ENV"

      - name: Install production SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY || secrets.PROD_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          identity_file="${HOME}/.ssh/production_deploy_key"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${identity_file}"
          chmod 600 "${identity_file}"
          echo "SSH_IDENTITY_FILE=${identity_file}" >> "$GITHUB_ENV"

      - name: Recover SSH daemon and authorized_keys on co-located VPS
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail

          pub_key="$(ssh-keygen -y -f "${SSH_IDENTITY_FILE}")"
          user_home="$(getent passwd "${SSH_USER}" | cut -d: -f6 || true)"
          [[ -n "${user_home}" ]] || user_home="/root"

          install_authorized_key() {
            local auth_dir="${user_home}/.ssh"
            local auth_file="${auth_dir}/authorized_keys"
            PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh mkdir -p "${auth_dir}"
            PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh chmod 700 "${auth_dir}"
            PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh touch "${auth_file}"
            if ! PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh grep -Fq "${pub_key}" "${auth_file}" 2>/dev/null; then
              echo "${pub_key} github-actions-production-deploy" | PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh tee -a "${auth_file}" >/dev/null
            fi
            PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh chmod 600 "${auth_file}"
            PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh chown -R "${SSH_USER}:${SSH_USER}" "${auth_dir}" "${auth_file}" 2>/dev/null || true
          }

          recover_sshd() {
            echo "==> ssh listeners before recovery"
            PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh ss -ltnp | grep ":${SSH_PORT} " || true
            if command -v fail2ban-client >/dev/null 2>&1; then
              if PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh fail2ban-client status sshd >/dev/null 2>&1; then
                PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh fail2ban-client set sshd unbanip 127.0.0.1 2>/dev/null || true
                PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh fail2ban-client set sshd unbanip 72.62.244.94 2>/dev/null || true
                PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh fail2ban-client unban --all 2>/dev/null || true
              fi
            fi
            PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh systemctl restart ssh 2>/dev/null || \
              PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh systemctl restart sshd
            sleep 3
            echo "==> recent ssh journal"
            PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh journalctl -u ssh --no-pager -n 30 2>/dev/null || \
              PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh journalctl -u sshd --no-pager -n 30 2>/dev/null || true
          }

          install_authorized_key
          recover_sshd

          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no \
            -i "${SSH_IDENTITY_FILE}" -p "${SSH_PORT}" "${SSH_USER}@127.0.0.1" "printf 'loopback-ssh-ok\n'"
          probe_rc=$?
          set -e
          if [[ "${probe_rc}" -ne 0 ]]; then
            echo "::warning::Loopback SSH still failing after recovery (rc=${probe_rc}); continuing with local deploy path"
          else
            echo "Loopback SSH probe passed"
          fi

      - name: Sync app-node assets locally on app node A
        if: inputs.recover_sshd_only != true
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          deploy_root="${PRODUCTION_DEPLOY_ROOT}"
          PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh mkdir -p "${deploy_root}"
          tar -cf - deployments/prod/app-node deployments/prod/shared deployments/prod/README.md migrations \
            scripts/deploy/production-migrate.sh scripts/verify_database_environment.sh scripts/db/verify_database_environment.sh | \
            PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh tar -xf - -C "${deploy_root}" --overwrite
          PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh chmod +x \
            "${deploy_root}/scripts/deploy/production-migrate.sh" \
            "${deploy_root}/scripts/verify_database_environment.sh" \
            "${deploy_root}/scripts/db/verify_database_environment.sh"

      - name: Log in to GHCR for image pull
        if: inputs.recover_sshd_only != true
        shell: bash
        env:
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ -n "${GHCR_PULL_USERNAME}" && -n "${GHCR_PULL_TOKEN}" ]] || {
            echo "error: GHCR_PULL_USERNAME / GHCR_PULL_TOKEN required for image pull" >&2
            exit 1
          }
          echo "${GHCR_PULL_TOKEN}" | PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh docker login ghcr.io -u "${GHCR_PULL_USERNAME}" --password-stdin

      - name: Roll out app node A locally (no SSH)
        if: inputs.recover_sshd_only != true
        shell: bash
        env:
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          remote_dir="${PRODUCTION_DEPLOY_ROOT}/deployments/prod/app-node"
          release_cmd="cd '${remote_dir}' && RUN_MIGRATION='${RUN_MIGRATION}' APP_NODE_ENABLE_TEMPORAL_PROFILE='0' bash scripts/release_app_node.sh '${APP_IMAGE_REF}' '${GOOSE_IMAGE_REF}'"
          PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh env \
            GHCR_PULL_USERNAME="${GHCR_PULL_USERNAME}" \
            GHCR_PULL_TOKEN="${GHCR_PULL_TOKEN}" \
            bash -lc "${release_cmd}"

      - name: Verify app node A health locally
        if: inputs.recover_sshd_only != true
        shell: bash
        env:
          PRODUCTION_ROOT_PASSWORD: ${{ secrets.PRODUCTION_ROOT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          remote_dir="${PRODUCTION_DEPLOY_ROOT}/deployments/prod/app-node"
          health_cmd="cd '${remote_dir}' && bash scripts/healthcheck_app_node.sh"
          PRODUCTION_ROOT_PASSWORD="${PRODUCTION_ROOT_PASSWORD}" /tmp/avf-prod-sudo.sh bash -lc "${health_cmd}"

      - name: Public smoke check
        if: inputs.recover_sshd_only != true
        shell: bash
        env:
          BASE_URL: ${{ vars.PRODUCTION_PUBLIC_BASE_URL || secrets.PRODUCTION_PUBLIC_BASE_URL }}
        run: |
          set -Eeuo pipefail
          [[ -n "${BASE_URL}" ]] || BASE_URL="https://api.ldtv.dev"
          curl -fsS "${BASE_URL%/}/health/live" >/dev/null
          curl -fsS "${BASE_URL%/}/health/ready" >/dev/null
          version_json="$(curl -fsS "${BASE_URL%/}/version")"
          echo "${version_json}" | tee "${GITHUB_STEP_SUMMARY}"
          echo "${version_json}" | grep -F "${APP_IMAGE_REF##*@}" >/dev/null || {
            echo "::warning::/version response did not include expected app digest (may still be rolling)"
          }
