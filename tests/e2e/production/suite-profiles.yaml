    exclude_flow_ids:
      - REST-COMMERCE-001
      - REST-COMMERCE-002
      - REST-COMMERCE-003
      - REST-COMMERCE-003-DUP
      - REST-COMMERCE-004
      - REST-COMMERCE-005
      - REST-COMMERCE-006
      - REST-NEG-002
      - REST-NEG-003
    exclude_coverage_path_substrings:
