      - REST-COMMERCE-003-DUP
      - REST-COMMERCE-004
      - REST-COMMERCE-005
      - REST-COMMERCE-006
      - REST-NEG-002
      - REST-NEG-003
      - GRPC-COMM-QR-001
    exclude_coverage_path_substrings:
      - /payment-session
      - /webhooks
      - /payments/
      - /refunds
    skip_reason: "excluded by operator request: no online payment test"
  grpc-inventory-media-cash-no-online-payment:
    description: >-
      Targeted gRPC inventory ack, media download cache, and cash commerce vend path.
    exclude_flow_ids:
