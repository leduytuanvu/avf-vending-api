%% EMQX 5.x file authorization rules for AVF machine isolation.
%% Production copy: MQTT_TOPIC_PREFIX avf/devices

{allow, {username, "avf-mqtt-api"}, publish, ["avf/devices/+/commands/dispatch", "avf/devices/machines/+/commands"]}.
{allow, {username, "avf-mqtt-api"}, subscribe, []}.

{allow, {username, "avf-mqtt-ingest"}, subscribe, ["avf/devices/#"]}.
{allow, {username, "avf-mqtt-ingest"}, publish, []}.

{allow, all, subscribe, ["avf/devices/machines/%u/commands", "avf/devices/machines/%u/commands/#"]}.
{allow, all, publish, ["avf/devices/machines/%u/commands/#", "avf/devices/machines/%u/telemetry/#", "avf/devices/machines/%u/events/#", "avf/devices/machines/%u/presence", "avf/devices/machines/%u/state/heartbeat", "avf/devices/machines/%u/shadow/reported", "avf/devices/machines/%u/shadow/desired"]}.

{allow, all, subscribe, ["avf/devices/%u/commands/dispatch", "avf/devices/%u/commands/#"]}.
{allow, all, publish, ["avf/devices/%u/telemetry/#", "avf/devices/%u/presence", "avf/devices/%u/state/heartbeat", "avf/devices/%u/events/#", "avf/devices/%u/shadow/reported", "avf/devices/%u/shadow/desired", "avf/devices/%u/commands/#"]}.

{deny, all}.
