%% EMQX 5.x file authorization rules for AVF machine isolation.
%% Production copy: MQTT_TOPIC_PREFIX avf/devices

{allow, {username, "avf-mqtt-api"}, publish, ["avf/devices/+/commands/dispatch", "avf/devices/machines/+/commands"]}.
{allow, {username, "avf-mqtt-api"}, subscribe, []}.

{allow, {username, "avf-mqtt-ingest"}, subscribe, ["avf/devices/#"]}.
{allow, {username, "avf-mqtt-ingest"}, publish, []}.

{allow, all, subscribe, ["avf/devices/machines/${username}/commands", "avf/devices/machines/${username}/commands/#"]}.
{allow, all, publish, ["avf/devices/machines/${username}/commands/#", "avf/devices/machines/${username}/telemetry/#", "avf/devices/machines/${username}/events/#", "avf/devices/machines/${username}/presence", "avf/devices/machines/${username}/state/heartbeat", "avf/devices/machines/${username}/shadow/reported", "avf/devices/machines/${username}/shadow/desired"]}.

{allow, all, subscribe, ["avf/devices/${username}/commands/dispatch", "avf/devices/${username}/commands/#"]}.
{allow, all, publish, ["avf/devices/${username}/telemetry/#", "avf/devices/${username}/presence", "avf/devices/${username}/state/heartbeat", "avf/devices/${username}/events/#", "avf/devices/${username}/shadow/reported", "avf/devices/${username}/shadow/desired", "avf/devices/${username}/commands/#"]}.

{deny, all}.
