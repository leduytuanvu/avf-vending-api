version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "db/schema/01_platform.sql"
    queries: "db/queries"
    gen:
      go:
        package: "db"
        out: "internal/gen/db"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        emit_exported_queries: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          # sqlc v1.31.1 still emits []uuid.UUID for uuid[] despite these _uuid /
          # uuid[] overrides. Do not treat generated types as the production fix.
          # Runtime encoding is pgxutil AfterConnect codecs + WrapQueryDBTX /
          # NewQueries. Never hand-edit internal/gen/db.
          - db_type: "_uuid"
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "FlatArray[uuid.UUID]"
          - db_type: "uuid[]"
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "FlatArray[uuid.UUID]"
          - db_type: "pg_catalog._uuid"
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "FlatArray[uuid.UUID]"
          - db_type: "timestamptz"
            go_type: "time.Time"
