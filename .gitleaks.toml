title = "AVF Vending API Gitleaks Config"

[extend]
useDefault = true

[[allowlists]]
description = "Example env and bootstrap files with placeholder values"
paths = [
  '''^\.env\.example$''',
  '''^deployments/.*/\.env\..*example$''',
  '''^deployments/staging/emqx/default_api_key\.conf\.example$''',
  '''^deployments/.*/emqx/certs/README\.md$'''
]

[[allowlists]]
description = "Intentional local development stack credentials"
paths = [
  '''^deployments/docker/docker-compose\.yml$''',
  '''^deployments/docker/postgres-init/01-init\.sql$''',
  '''^deployments/docker/README\.md$'''
]

[[allowlists]]
description = "Production E2E manual retest docs (redacted operator guides and API traces)"
paths = [
  '''^docs/testing/production-e2e/(MANUAL_RETEST_GUIDE|API_TRACE|POSTMAN_IMPORT_PARITY)_.*\.md$'''
]

[[allowlists]]
description = "Known false positives in release/runtime helper and generated OpenAPI artifacts"
paths = [
  '''^deployments/prod/scripts/release\.sh$''',
  '''^tools/build_openapi\.py$''',
  '''^docs/swagger/swagger\.json$'''
]

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Generated Postman full production suite (openapiOperationId metadata flagged as generic-api-key)"
paths = [
  '''postman/suites/production-full/avf-vending-production\.full\.postman_collection\.json''',
  '''postman/suites/production-full/avf-vending-production\.full\.postman_environment\.json''',
  '''postman/collections/avf-vending-production-full\.postman_collection\.json''',
  '''postman/environments/avf-production-full\.postman_environment\.json''',
]
