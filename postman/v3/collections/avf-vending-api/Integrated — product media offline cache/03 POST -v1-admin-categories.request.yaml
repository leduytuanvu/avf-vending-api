$kind: http-request
name: 03 POST /v1/admin/categories
description: Create category (OpenAPI-aligned example).
url: "{{baseUrl}}/v1/admin/categories"
method: POST
body:
  type: json
  content: |-
    {
      "name": "Drinks {{$timestamp}}",
      "slug": "drinks-{{$timestamp}}",
      "active": true
    }
order: 3000
