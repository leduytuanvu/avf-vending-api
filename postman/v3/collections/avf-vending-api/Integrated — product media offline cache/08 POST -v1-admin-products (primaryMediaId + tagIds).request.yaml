$kind: http-request
name: 08 POST /v1/admin/products (primaryMediaId + tagIds)
description: Sellable product referencing completed media + tags.
url: "{{baseUrl}}/v1/admin/products"
method: POST
body:
  type: json
  content: |-
    {
      "sku": "COCA-330ML-{{$timestamp}}",
      "name": "Coca Cola Can 330ml",
      "description": "Canary test product",
      "categoryId": "{{categoryId}}",
      "brandId": "{{brandId}}",
      "tagIds": ["{{tagId}}"],
      "primaryMediaId": "{{mediaId}}",
      "status": "active",
      "active": true,
      "ageRestricted": false,
      "allergenCodes": []
    }
order: 8000
