$kind: http-request
name: 18 GET /v1/admin/machines/{machineId}/inventory (before commerce)
description: Snapshot quantities before vend path.
url: "{{baseUrl}}/v1/admin/machines/{{machineId}}/inventory"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('inventory before', function () {
        pm.response.to.have.status(200);
        pm.environment.set('inventorySnapshotBefore', pm.response.text());
      });
    language: text/javascript
order: 18000
