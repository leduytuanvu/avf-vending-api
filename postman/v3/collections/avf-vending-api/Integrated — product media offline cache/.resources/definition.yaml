  1 Login → 2 auth/me → 3–5 category/brand/tag → 6–7 media init/complete → 8–9 product + GET verify → 10 site → 11 machine → 12 activation code → 13 claim (`machineToken`) → 14–16 topology/planogram/publish → 17 sync → 18 inventory snapshot → 19–23 commerce + vend → 24 inventory verify → 25–26 reporting/audit → 27 version stub (see FULL100 README for gRPC/MQTT).
