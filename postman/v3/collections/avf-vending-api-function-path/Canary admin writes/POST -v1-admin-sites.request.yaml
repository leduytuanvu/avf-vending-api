$kind: http-request
name: POST /v1/admin/sites
description: "Create company site. Local/dev POST is gated: set allow_destructive=true or canaryMode=true. Request URL is exactly {{baseUrl}}/v1/admin/sites with no query parameters. Requires auth_type=admin and admin_token."
url: "{{baseUrl}}/v1/admin/sites"
method: POST
body:
  type: json
  content: |-
    {
      "name": "Postman Canary Site",
      "code": "PM-{{$timestamp}}",
      "timezone": "UTC",
      "address": {}
    }
order: 1000
