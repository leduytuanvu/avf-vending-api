$kind: http-request
name: 19 POST /v1/commerce/orders
description: Create checkout order (machine bearer).
url: "{{baseUrl}}/v1/commerce/orders"
method: POST
body:
  type: json
  content: |-
    {
      "machine_id": "{{machineId}}",
      "product_id": "{{productId}}",
      "slot_index": 3,
      "currency": "USD",
      "subtotal_minor": 125,
      "tax_minor": 10,
      "total_minor": 135
    }
auth:
  type: bearer
  credentials:
    token: "{{machineToken}}"
order: 19000
