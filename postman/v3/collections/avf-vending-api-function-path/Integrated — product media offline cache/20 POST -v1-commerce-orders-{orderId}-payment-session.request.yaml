$kind: http-request
name: 20 POST /v1/commerce/orders/{orderId}/payment-session
description: Payment session envelope.
url: "{{baseUrl}}/v1/commerce/orders/{{order_id}}/payment-session"
method: POST
body:
  type: json
  content: |-
    {
      "provider": "stripe",
      "payment_state": "created",
      "amount_minor": 135,
      "currency": "USD",
      "outbox_payload_json": {"source": "postman_integrated_flow"}
    }
auth:
  type: bearer
  credentials:
    token: "{{machineToken}}"
order: 20000
