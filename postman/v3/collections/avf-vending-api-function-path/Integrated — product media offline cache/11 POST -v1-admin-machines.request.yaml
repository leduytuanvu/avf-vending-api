$kind: http-request
name: 11 POST /v1/admin/machines
description: Provision machine draft on site.
url: "{{baseUrl}}/v1/admin/machines"
method: POST
body:
  type: json
  content: |-
    {
      "siteId": "{{siteId}}",
      "serialNumber": "SN-PM-{{$timestamp}}",
      "code": "M-{{$timestamp}}",
      "name": "Offline cache machine",
      "model": "AVF-1",
      "cabinetType": "ambient",
      "timezone": "UTC",
      "status": "draft"
    }
order: 11000
