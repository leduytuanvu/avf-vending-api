$kind: http-request
name: REST-MACHINE-006 — GET /v1/machines/{id}/sale-catalog (legacy HTTP)
url: "{{baseUrl}}/v1/machines/{{machineId}}/sale-catalog?include_unavailable=true&include_images=true"
method: GET
headers:
  Content-Type: application/json
queryParams:
  include_unavailable: "true"
  include_images: "true"
auth:
