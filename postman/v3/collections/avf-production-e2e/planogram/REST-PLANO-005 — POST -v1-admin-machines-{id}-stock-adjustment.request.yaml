$kind: http-request
name: REST-PLANO-005 — POST /v1/admin/machines/{id}/stock-adjustments
url: "{{baseUrl}}/v1/admin/machines/{{machineId}}/stock-adjustments"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{runPrefix}}-REST-PLANO-005"
body:
  type: text
  content: |-
    {
      "operator_session_id": "{{operatorSessionId}}",
      "reason": "restock",
      "items": [
        {
          "cabinetCode": "A",
          "slotCode": "A1",
          "slotIndex": 1,
          "productId": "{{productId}}",
          "planogramId": "{{planogramId}}",
          "quantityBefore": 0,
          "quantityAfter": 8
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const allow = String(pm.environment.get('allowGatedWrites')||'').toLowerCase()==='true';
      const confirm = pm.environment.get('confirmProductionWrites')==='I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION';
      if (!allow || !confirm) { throw new Error('Gated write blocked'); }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('expected HTTP status (manifest)', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 6000
