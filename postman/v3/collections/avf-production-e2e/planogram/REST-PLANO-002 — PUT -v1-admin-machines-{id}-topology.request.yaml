$kind: http-request
name: REST-PLANO-002 — PUT /v1/admin/machines/{id}/topology
url: "{{baseUrl}}/v1/admin/machines/{{machineId}}/topology"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "operator_session_id": "{{operatorSessionId}}",
      "cabinets": [
        {
          "code": "A",
          "title": "Cabinet A",
          "sortOrder": 1,
          "metadata": {}
        }
      ],
      "layouts": [
        {
          "cabinetCode": "A",
          "layoutKey": "grid-4x6",
          "revision": 1,
          "layoutSpec": {
            "rows": 4,
            "cols": 6
          },
          "status": "published"
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const allow = String(pm.environment.get('allowGatedWrites')||'').toLowerCase()==='true';
      const confirm = pm.environment.get('confirmProductionWrites')==='I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION';
      if (!allow || !confirm) { throw new Error('Gated write blocked'); }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('expected HTTP status (manifest)', function () {
        pm.response.to.have.status(204);
      });
    language: text/javascript
order: 3000
