$kind: http-request
name: REST-PLANO-001 — POST /v1/admin/machines/{id}/operator-sessions/start
url: "{{baseUrl}}/v1/admin/machines/{{machineId}}/operator-sessions/start"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{runPrefix}}-REST-PLANO-001"
body:
  type: text
  content: |-
    {
      "force_admin_takeover": true,
      "auth_method": "oidc"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const allow = String(pm.environment.get('allowGatedWrites')||'').toLowerCase()==='true';
      const confirm = pm.environment.get('confirmProductionWrites')==='I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION';
      if (!allow || !confirm) { throw new Error('Gated write blocked'); }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('expected HTTP status (manifest)', function () {
        pm.response.to.have.status(200);
      });
      try {
        const j = pm.response.json();
        if (j.session.id !== undefined) pm.environment.set('operatorSessionId', j.session.id);
      } catch (e) {}
    language: text/javascript
order: 2000
