$kind: http-request
name: REST-MACHINE-003 — POST /v1/admin/machine-codes/{machineCode}/activation-codes
url: "{{baseUrl}}/v1/admin/machine-codes/{{machineCode}}/activation-codes"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{runPrefix}}-REST-MACHINE-003"
body:
  type: text
  content: |-
    {
      "expiresInMinutes": 10080,
      "maxUses": 2,
      "notes": "{{runPrefix}} e2e activation"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const allow = String(pm.environment.get('allowGatedWrites')||'').toLowerCase()==='true';
      const confirm = pm.environment.get('confirmProductionWrites')==='I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION';
      if (!allow || !confirm) { throw new Error('Gated write blocked'); }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('expected HTTP status (manifest)', function () {
        pm.response.to.have.status(201);
      });
      pm.test('assertion 0: json_path_exists activationCode', function () {
        const j = pm.response.json();
        pm.expect(j.activationCode).to.not.be.undefined;
      });
      try {
        const j = pm.response.json();
        if (j.activationCodeId !== undefined) pm.environment.set('activationCodeId', j.activationCodeId);
        if (j.activationCode !== undefined) pm.environment.set('activationCode', j.activationCode);
        if (j.machineId !== undefined) pm.environment.set('machineId', j.machineId);
        if (j.machineCode !== undefined) pm.environment.set('machineCode', j.machineCode);
      } catch (e) {}
    language: text/javascript
order: 4000
