$kind: http-request
name: REST-MACHINE-002 — PATCH /v1/admin/machines/{id} active
url: "{{baseUrl}}/v1/admin/machines/{{machineId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "active"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const allow = String(pm.environment.get('allowGatedWrites')||'').toLowerCase()==='true';
      const confirm = pm.environment.get('confirmProductionWrites')==='I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION';
      if (!allow || !confirm) { throw new Error('Gated write blocked'); }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('expected HTTP status (manifest)', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
