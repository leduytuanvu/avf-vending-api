$kind: http-request
name: REST-AUTH-005 — GET /v1/admin/categories with machine token (wrong role)
url: "{{baseUrl}}/v1/admin/categories?limit=1"
method: GET
headers:
  Content-Type: application/json
queryParams:
  limit: "1"
auth:
  type: bearer
  credentials:
    token: "{{machineAccessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const allow = String(pm.environment.get('allowGatedWrites')||'').toLowerCase()==='true';
      const confirm = pm.environment.get('confirmProductionWrites')==='I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION';
      if (!allow || !confirm) { throw new Error('Gated write blocked'); }
    language: text/javascript
  - type: beforeRequest
    code: |-
      const skipIfEnv = pm.variables.get('_postman_skip_if_env_var');
      pm.variables.set('_postman_skip_if_env_var', 'SKIP_WRONG_ROLE_TEST');
      if (skipIfEnv && pm.environment.get(skipIfEnv)) {
        pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('expected HTTP status (manifest)', function () {
        pm.response.to.have.status(403);
      });
    language: text/javascript
order: 7000
