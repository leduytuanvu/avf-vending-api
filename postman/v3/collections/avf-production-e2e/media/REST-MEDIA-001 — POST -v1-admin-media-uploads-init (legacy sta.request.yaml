$kind: http-request
name: REST-MEDIA-001 — POST /v1/admin/media/uploads/init (legacy standalone)
url: "{{baseUrl}}/v1/admin/media/uploads/init"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{runPrefix}}-REST-MEDIA-001"
body:
  type: text
  content: |-
    {
      "filename": "{{runPrefix}}-legacy.png",
      "contentType": "image/png",
      "purpose": "product_image"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const allow = String(pm.environment.get('allowGatedWrites')||'').toLowerCase()==='true';
      const confirm = pm.environment.get('confirmProductionWrites')==='I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION';
      if (!allow || !confirm) { throw new Error('Gated write blocked'); }
    language: text/javascript
  - type: beforeRequest
    code: |-
      const skipIfEnv = pm.variables.get('_postman_skip_if_env_var');
      pm.variables.set('_postman_skip_if_env_var', 'PROD_E2E_USE_MEDIA_PIPE');
      if (skipIfEnv && pm.environment.get(skipIfEnv)) {
        pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('expected HTTP status (manifest)', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1000
