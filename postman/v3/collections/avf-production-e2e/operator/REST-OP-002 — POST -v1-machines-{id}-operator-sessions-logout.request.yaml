$kind: http-request
name: REST-OP-002 — POST /v1/machines/{id}/operator-sessions/logout (legacy HTTP)
url: "{{baseUrl}}/v1/machines/{{machineId}}/operator-sessions/logout"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{runPrefix}}-REST-OP-002"
body:
  type: text
  content: |-
    {
      "operator_session_id": "{{operatorSessionId}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const allow = String(pm.environment.get('allowGatedWrites')||'').toLowerCase()==='true';
      const confirm = pm.environment.get('confirmProductionWrites')==='I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION';
      if (!allow || !confirm) { throw new Error('Gated write blocked'); }
    language: text/javascript
  - type: beforeRequest
    code: |-
      const skipIfEnv = pm.variables.get('_postman_skip_if_env_var');
      pm.variables.set('_postman_skip_if_env_var', 'PROD_E2E_SKIP_LEGACY_MACHINE_HTTP');
      if (skipIfEnv && pm.environment.get(skipIfEnv)) {
        pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('expected HTTP status (manifest)', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 2000
