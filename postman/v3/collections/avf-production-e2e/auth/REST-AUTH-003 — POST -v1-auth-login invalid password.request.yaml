$kind: http-request
name: REST-AUTH-003 — POST /v1/auth/login invalid password
url: "{{baseUrl}}/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{adminEmailInvalidTest}}",
      "password": "invalid-e2e-password-{{runId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('expected HTTP status (manifest)', function () {
        pm.response.to.have.status(401);
      });
    language: text/javascript
order: 3000
