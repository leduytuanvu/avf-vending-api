$kind: http-request
name: REST-MEDIA-INIT — POST /v1/admin/media/uploads/init
url: "{{baseUrl}}/v1/admin/media/uploads/init"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{runPrefix}}-REST-MEDIA-INIT"
body:
  type: text
  content: |-
    {
      "filename": "{{runPrefix}}-product.png",
      "contentType": "image/png",
      "purpose": "product_image"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const allow = String(pm.environment.get('allowGatedWrites')||'').toLowerCase()==='true';
      const confirm = pm.environment.get('confirmProductionWrites')==='I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION';
      if (!allow || !confirm) { throw new Error('Gated write blocked'); }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('expected HTTP status (manifest)', function () {
        pm.response.to.have.status(200);
      });
      pm.test('assertion 0: json_path_exists mediaId', function () {
        const j = pm.response.json();
        pm.expect(j.mediaId).to.not.be.undefined;
      });
    language: text/javascript
order: 2000
