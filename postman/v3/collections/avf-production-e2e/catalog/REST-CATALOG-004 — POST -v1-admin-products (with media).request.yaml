$kind: http-request
name: REST-CATALOG-004 — POST /v1/admin/products (with media)
url: "{{baseUrl}}/v1/admin/products"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{runPrefix}}-REST-CATALOG-004"
body:
  type: text
  content: |-
    {
      "sku": "{{runPrefix}}-SKU",
      "name": "{{runPrefix}} Product",
      "status": "active",
      "categoryId": "{{categoryId}}",
      "brandId": "{{brandId}}",
      "tagIds": [
        "{{tagId}}"
      ],
      "primaryMediaId": "{{mediaId}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const allow = String(pm.environment.get('allowGatedWrites')||'').toLowerCase()==='true';
      const confirm = pm.environment.get('confirmProductionWrites')==='I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION';
      if (!allow || !confirm) { throw new Error('Gated write blocked'); }
    language: text/javascript
  - type: beforeRequest
    code: |-
      const reuse = String(pm.environment.get('newmanReuseShellState')||'').toLowerCase()==='true';
      pm.variables.set('_postman_skip_if_env_key', 'productId');
      const skipKey = pm.variables.get('_postman_skip_if_env') || pm.request?.headers?.get?.('_postman_skip_if_env');
      const envKey = pm.variables.get('_postman_skip_if_env_key');
      if (reuse && envKey && pm.environment.get(envKey)) {
        pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('expected HTTP status (manifest)', function () {
        pm.response.to.have.status(200);
      });
      pm.test('assertion 0: json_path_exists id', function () {
        const j = pm.response.json();
        pm.expect(j.id).to.not.be.undefined;
      });
      pm.test('assertion 1: json_path_exists primaryMediaId', function () {
        const j = pm.response.json();
        pm.expect(j.primaryMediaId).to.not.be.undefined;
      });
      try {
        const j = pm.response.json();
        if (j.id !== undefined) pm.environment.set('productId', j.id);
        if (j.sku !== undefined) pm.environment.set('sku', j.sku);
      } catch (e) {}
    language: text/javascript
order: 4000
