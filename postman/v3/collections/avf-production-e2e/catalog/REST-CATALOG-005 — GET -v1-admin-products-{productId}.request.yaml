$kind: http-request
name: REST-CATALOG-005 — GET /v1/admin/products/{productId}
url: "{{baseUrl}}/v1/admin/products/{{productId}}"
method: GET
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const allow = String(pm.environment.get('allowGatedWrites')||'').toLowerCase()==='true';
      const confirm = pm.environment.get('confirmProductionWrites')==='I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION';
      if (!allow || !confirm) { throw new Error('Gated write blocked'); }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('expected HTTP status (manifest)', function () {
        pm.response.to.have.status(200);
      });
      pm.test('assertion 0: json_path_equals id', function () {
        const j = pm.response.json();
        pm.expect(String(j.id)).to.eql(String(pm.environment.get('productId')));
      });
      pm.test('assertion 1: json_path_exists primaryMediaId', function () {
        const j = pm.response.json();
        pm.expect(j.primaryMediaId).to.not.be.undefined;
      });
    language: text/javascript
order: 5000
