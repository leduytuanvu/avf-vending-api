$kind: http-request
name: REST-PREFLIGHT-003 — GET /version
url: "{{baseUrl}}/version"
method: GET
headers:
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('expected HTTP status (manifest)', function () {
        pm.response.to.have.status(200);
      });
      pm.test('assertion 0: json_path_exists version', function () {
        const j = pm.response.json();
        pm.expect(j.version).to.not.be.undefined;
      });
    language: text/javascript
order: 3000
