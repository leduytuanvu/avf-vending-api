$kind: http-request
name: POST /v1/admin/auth/users — Create API account (admin)
description: |-
  ## Purpose
  Create API account (admin)

  ## Auth mode
  `admin` — required: accessToken (set via 02 Auth login)

  ## Required variables
  accessToken (set via 02 Auth login)

  ## Headers
  - Accept: application/json
  - X-Request-ID: {{requestId}}
  - X-Correlation-ID: {{correlationId}}
  - Authorization: Bearer {{accessToken}}
  - X-Request-ID: (from OpenAPI)
  - X-Correlation-ID: (from OpenAPI)

  ## Path parameters
  _None_

  ## Query parameters
  _None_

  ## Required body fields
  - `email` (string (email))
  - `password` (string)
  - `roles` (array)

  ## Optional body fields
  - `status` (string)

  ## Enum / options
  - `status`: `active`, `disabled`, `locked`, `invited`

  ## Success response
  HTTP **201**

  ## Common failure statuses
  `400`, `401`, `403`, `409`, `429`, `500`

  ## Safety note
  Mutating — requires allowGatedWrites=true and confirmProductionWrites=I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION.

  ## Metadata
  - openapiOperationId: `DocOpV1AdminAuthUsersCreate`
  - openapiKey: `POST /v1/admin/auth/users`
  - production_write: yes
