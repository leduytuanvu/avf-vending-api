$kind: http-request
name: gRPC MachineAuthService/ActivateMachine — Activate Machine
description: |
  **gRPC manual test** (Postman Desktop → New → gRPC Request)

  - **fullMethod:** `/avf.machine.v1.MachineAuthService/ActivateMachine`
  - **Proto:** `proto/avf/machine/v1/auth.proto`
  - **Target:** `{{grpcTarget}}` (TLS)
  - **Registered:** machine

  **Metadata:** authorization: Bearer {{machineToken}}; x-request-id: {{requestId}}; x-correlation-id: {{correlationId}}

  **Request JSON:**
  ```json
  {
    "claim": {
      "activation_code": "string",
      "device_fingerprint": {
        "android_id": "{{androidId}}",
        "serial_number": "string",
        "manufacturer": "string",
        "model": "string",
        "package_name": "string",
        "version_name": "string",
        "version_code": 1
      }
    }
  }
  ```

  **Response shape:**
  ```json
  {
    "claim": {
      "machine_id": "{{machineId}}",
      "site_id": "{{siteId}}",
      "machine_name": "string",
      "access_token": "string",
      "access_token_expires_at": {},
      "refresh_token": "string",
      "refresh_token_expires_at": {},
      "mqtt_broker_url": "string",
      "mqtt_topic_prefix": "string",
      "mqtt_topic_layout": "string",
      "bootstrap_http_path": "string",
      "bootstrap_required": false
    }
  }
  ```

  **gRPC error statuses:** UNAUTHENTICATED, PERMISSION_DENIED, INVALID_ARGUMENT, NOT_FOUND, FAILED_PRECONDITION, INTERNAL
url: grpcs://{{grpcTarget}}
method: GRPC
scripts:
  - type: afterResponse
    code: |-
      pm.test("expected HTTP success unless negative test", function () {
        if (pm.collectionVariables.get('negative_test') === 'true') { return; }
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
order: 3000
