$kind: http-request
name: gRPC MachineTelemetryService/CheckIn — Check In
description: |
  **gRPC manual test** (Postman Desktop → New → gRPC Request)

  - **fullMethod:** `/avf.machine.v1.MachineTelemetryService/CheckIn`
  - **Proto:** `proto/avf/machine/v1/telemetry.proto`
  - **Target:** `{{grpcTarget}}` (TLS)
  - **Registered:** machine

  **Metadata:** authorization: Bearer {{machineToken}}; x-request-id: {{requestId}}; x-correlation-id: {{correlationId}}

  **Request JSON:**
  ```json
  {
    "context": {
      "idempotency_key": "{{idempotencyKey}}",
      "client_event_id": "{{clientEventId}}",
      "client_created_at": {},
      "operator_session_id": "{{operatorSessionId}}"
    },
    "machine_id": "{{machineId}}",
    "android_id": "{{androidId}}",
    "sim_serial": "string",
    "package_name": "string",
    "version_name": "string",
    "version_code": 1,
    "android_release": "{{androidRelease}}",
    "sdk_int": 1,
    "manufacturer": "string",
    "model": "string",
    "timezone": "string",
    "network_state": "string",
    "boot_id": "{{bootId}}"
  }
  ```

  **Response shape:**
  ```json
  {
    "replay": false,
    "machine_id": "{{machineId}}",
    "server_received_at": {}
  }
  ```

  **gRPC error statuses:** UNAUTHENTICATED, PERMISSION_DENIED, INVALID_ARGUMENT, NOT_FOUND, FAILED_PRECONDITION, INTERNAL
url: grpcs://{{grpcTarget}}
method: GRPC
scripts:
  - type: afterResponse
    code: |-
      pm.test("expected HTTP success unless negative test", function () {
        if (pm.collectionVariables.get('negative_test') === 'true') { return; }
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
order: 66000
