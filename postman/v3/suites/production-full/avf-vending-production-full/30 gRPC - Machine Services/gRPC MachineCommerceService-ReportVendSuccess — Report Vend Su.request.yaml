        "tx_rx_digest": "string",
        "raw_ref": "string"
      },
      "bill_final": {
        "event_id": "{{eventId}}",
        "amount_minor": 1,
        "currency": "string",
        "raw_ref": "string"
      },
      "tcn_dispense": {
