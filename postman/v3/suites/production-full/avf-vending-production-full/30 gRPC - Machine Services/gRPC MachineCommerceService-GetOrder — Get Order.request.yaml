$kind: http-request
name: gRPC MachineCommerceService/GetOrder — Get Order
description: |
  **gRPC manual test** (Postman Desktop → New → gRPC Request)

  - **fullMethod:** `/avf.machine.v1.MachineCommerceService/GetOrder`
  - **Proto:** `proto/avf/machine/v1/commerce.proto`
  - **Target:** `{{grpcTarget}}` (TLS)
  - **Registered:** machine

  **Metadata:** authorization: Bearer {{machineToken}}; x-request-id: {{requestId}}; x-correlation-id: {{correlationId}}

  **Request JSON:**
  ```json
  {
    "order_id": "{{orderId}}",
    "slot_index": 1
  }
  ```

  **Response shape:**
  ```json
  {
    "order_id": "{{orderId}}",
    "order_status": "string",
    "currency": "string",
    "subtotal_minor": 1,
    "tax_minor": 1,
    "total_minor": 1,
    "order_created_at": {},
    "vend_state": "string",
    "vend_slot_index": 1,
    "product_id": "{{productId}}",
    "payment_present": false,
    "payment_id": "{{paymentId}}",
    "payment_provider": "{{paymentProvider}}",
    "payment_state": "string"
  }
  ```

  **gRPC error statuses:** UNAUTHENTICATED, PERMISSION_DENIED, INVALID_ARGUMENT, NOT_FOUND, FAILED_PRECONDITION, INTERNAL
url: grpcs://{{grpcTarget}}
method: GRPC
scripts:
  - type: afterResponse
    code: |-
      pm.test("expected HTTP success unless negative test", function () {
        if (pm.collectionVariables.get('negative_test') === 'true') { return; }
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
order: 32000
