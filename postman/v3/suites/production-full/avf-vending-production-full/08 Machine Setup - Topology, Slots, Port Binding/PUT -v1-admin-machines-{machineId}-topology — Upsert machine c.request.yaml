$kind: http-request
name: PUT /v1/admin/machines/{machineId}/topology — Upsert machine cabinet topology and slot layouts
description: |-
  ## Purpose
  Upsert machine cabinet topology and slot layouts

  ## Auth mode
  `admin` — required: accessToken (set via 02 Auth login)

  ## Required variables
  accessToken (set via 02 Auth login)

  ## Headers
  - Accept: application/json
  - X-Request-ID: {{requestId}}
  - X-Correlation-ID: {{correlationId}}
  - Authorization: Bearer {{accessToken}}
  - X-Request-ID: (from OpenAPI)
  - X-Correlation-ID: (from OpenAPI)

  ## Path parameters
  - `machineId` (string)

  ## Query parameters
  _None_

  ## Required body fields
  _None_

  ## Optional body fields
  _None_

  ## Enum / options
  _None documented in schema_

  ## Success response
  HTTP **204**

  ## Common failure statuses
  `400`, `401`, `403`, `404`, `409`, `429`, `500`, `503`

  ## Safety note
  Mutating — requires allowGatedWrites=true and confirmProductionWrites=I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION.

  ## Metadata
  - openapiOperationId: `DocOpV1AdminMachineTopologyPut`
  - openapiKey: `PUT /v1/admin/machines/{machineId}/topology`
  - production_write: yes
  - idempotency: no
url: "{{baseUrl}}/v1/admin/machines/{{machineId}}/topology"
method: PUT
headers:
  Accept: application/json
  X-Request-ID: "{{requestId}}"
  X-Correlation-ID: "{{correlationId}}"
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "cabinets": [
        {
          "code": "A",
          "metadata": {},
          "sortOrder": 1,
          "title": "Main cabinet"
        }
      ],
      "layouts": [
        {
          "cabinetCode": "A",
          "layoutKey": "grid-4x6",
          "layoutSpec": {
            "cols": 6,
            "rows": 4
          },
          "revision": 1,
          "status": "active"
        }
      ],
      "operator_session_id": "dddddddd-eeee-ffff-0000-111111111111"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      pm.environment.set('auth_type', 'admin');
      pm.collectionVariables.set('requires_idempotency', 'false');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("expected HTTP success unless negative test", function () {
        if (pm.collectionVariables.get('negative_test') === 'true') { return; }
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
examples: ./.resources/PUT -v1-admin-machines-{machineId}-topology — Upsert machine c.resources/examples
order: 8000
