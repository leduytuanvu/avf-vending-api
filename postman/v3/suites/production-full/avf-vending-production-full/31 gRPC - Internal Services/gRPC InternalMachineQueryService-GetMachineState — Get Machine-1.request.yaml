$kind: http-request
name: gRPC InternalMachineQueryService/GetMachineState — Get Machine State
description: |
  **gRPC manual test** (Postman Desktop → New → gRPC Request)

  - **fullMethod:** `/avf.v1.InternalMachineQueryService/GetMachineState`
  - **Proto:** `proto/avf/v1/internal_queries.proto`
  - **Target:** `{{grpcTarget}}` (TLS)
  - **Registered:** not-registered

  **Metadata:** authorization: Bearer {{accessToken}}; x-request-id: {{requestId}}; x-correlation-id: {{correlationId}}

  **Request JSON:**
  ```json
  {
    "machine_id": "{{machineId}}"
  }
  ```

  **Response shape:**
  ```json
  {
    "shadow": {
      "machine_id": "{{machineId}}",
      "desired_state": {},
      "reported_state": {},
      "version": 1
    },
    "snapshot": {
      "machine_id": "{{machineId}}",
      "site_id": "{{siteId}}",
      "reported_state": {},
      "metrics_state": {},
      "last_heartbeat_at": {},
      "app_version": {},
      "firmware_version": {},
      "updated_at": {},
      "android_id": {},
      "sim_serial": {},
      "sim_iccid": {},
      "device_model": {},
      "os_version": {},
      "last_identity_at": {},
      "effective_timezone": "string"
    }
  }
  ```

  **gRPC error statuses:** UNAUTHENTICATED, PERMISSION_DENIED, INVALID_ARGUMENT, NOT_FOUND, FAILED_PRECONDITION, INTERNAL
url: grpcs://{{grpcTarget}}
method: GRPC
scripts:
  - type: afterResponse
    code: |-
      pm.test("expected HTTP success unless negative test", function () {
        if (pm.collectionVariables.get('negative_test') === 'true') { return; }
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
order: 8000
