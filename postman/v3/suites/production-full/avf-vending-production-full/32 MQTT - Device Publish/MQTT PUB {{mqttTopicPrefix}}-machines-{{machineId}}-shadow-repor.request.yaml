$kind: http-request
name: MQTT PUB {{mqttTopicPrefix}}/machines/{{machineId}}/shadow/reported — reported
description: |
  **MQTT manual test** (Postman Desktop → New → MQTT)

  - **Broker:** `{{mqttBrokerUrl}}`
  - **Client ID:** `{{mqttClientId}}`
  - **Topic:** `{{mqttTopicPrefix}}/machines/{{machineId}}/shadow/reported`
  - **Direction:** machine_publishes
  - **QoS:** {{mqttQos}} | **Retain:** {{mqttRetain}}

  **Payload (accepted):**
  ```json
  {
    "machine_id": "{{machineId}}",
    "reported": {
      "configVersion": 1
    }
  }
  ```

  **Payload (rejected example):** invalid schema_version or wrong machine_id
url: "{{mqttBrokerUrl}}"
method: MQTT
scripts:
  - type: afterResponse
    code: |-
      pm.test("expected HTTP success unless negative test", function () {
        if (pm.collectionVariables.get('negative_test') === 'true') { return; }
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
order: 8000
