$kind: http-request
name: "[PRODUCTION-WRITE] POST /v1/admin/machines/{machineId}/stock-adjustments — Apply stock adjustments (restock, cycle count, manual, reconcile)"
description: |-
  ## Purpose
  Apply stock adjustments (restock, cycle count, manual, reconcile)

  ## Auth mode
  `admin` — required: accessToken (set via 02 Auth login)

  ## Required variables
  accessToken (set via 02 Auth login)

  ## Headers
  - Accept: application/json
  - X-Request-ID: {{requestId}}
  - X-Correlation-ID: {{correlationId}}
  - Idempotency-Key: {{idempotencyKey}}
  - Authorization: Bearer {{accessToken}}
  - X-Request-ID: (from OpenAPI)
  - X-Correlation-ID: (from OpenAPI)
  - Idempotency-Key: (from OpenAPI)

  ## Path parameters
  - `machineId` (string)

  ## Query parameters
  _None_

  ## Required body fields
  - `items` (array)
  - `operator_session_id` (string (uuid))
  - `reason` (string)

  ## Optional body fields
  - `occurredAt` (string (date-time)) — RFC3339 with fractional seconds and explicit timezone offset (RFC3339Nano). Responses use UTC (Z).

  ## Enum / options
  - `reason`: `restock`, `cycle_count`, `manual_adjustment`, `machine_reconcile`

  ## Success response
  HTTP **200**

  ## Common failure statuses
  `400`, `401`, `403`, `404`, `409`, `429`, `500`

  ## Safety note
  Mutating — requires allowGatedWrites=true and confirmProductionWrites=I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION. **HIGH RISK** — item disabled by default.

  ## Metadata
  - openapiOperationId: `DocOpV1AdminMachineStockAdjustmentsPost`
  - openapiKey: `POST /v1/admin/machines/{machineId}/stock-adjustments`
  - production_write: yes
  - idempotency: yes
url: "{{baseUrl}}/v1/admin/machines/{{machineId}}/stock-adjustments"
method: POST
