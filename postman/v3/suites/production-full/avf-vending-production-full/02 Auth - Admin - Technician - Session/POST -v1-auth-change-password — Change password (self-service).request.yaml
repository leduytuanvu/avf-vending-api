$kind: http-request
name: POST /v1/auth/change-password — Change password (self-service)
description: |-
  ## Purpose
  Change password (self-service)

  ## Auth mode
  `admin` — required: accessToken (set via 02 Auth login)

  ## Required variables
  accessToken (set via 02 Auth login)

  ## Headers
  - Accept: application/json
  - X-Request-ID: {{requestId}}
  - X-Correlation-ID: {{correlationId}}
  - Authorization: Bearer {{accessToken}}
  - X-Request-ID: (from OpenAPI)
  - X-Correlation-ID: (from OpenAPI)

  ## Path parameters
  _None_

  ## Query parameters
  _None_

  ## Required body fields
  - `currentPassword` (string)
  - `newPassword` (string)

  ## Optional body fields
  _None_

  ## Enum / options
  _None documented in schema_

  ## Success response
  HTTP **204**

  ## Common failure statuses
  `400`, `401`, `500`

  ## Safety note
  Mutating — requires allowGatedWrites=true and confirmProductionWrites=I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION.

  ## Metadata
  - openapiOperationId: `DocOpV1AuthChangePassword`
  - openapiKey: `POST /v1/auth/change-password`
  - production_write: yes
  - idempotency: no
url: "{{baseUrl}}/v1/auth/change-password"
method: POST
headers:
  Accept: application/json
  X-Request-ID: "{{requestId}}"
  X-Correlation-ID: "{{correlationId}}"
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "example-password-old",
      "newPassword": "example-password-new"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
