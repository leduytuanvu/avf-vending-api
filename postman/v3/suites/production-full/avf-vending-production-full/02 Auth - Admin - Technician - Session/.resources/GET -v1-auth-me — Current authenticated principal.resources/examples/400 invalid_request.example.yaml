$kind: http-example
request:
  url: "{{baseUrl}}/"
  method: GET
response:
  statusCode: 400
  statusText: Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "invalid_request",
          "message": "validation failed",
          "requestId": "{{requestId}}"
        }
      }
order: 4000
