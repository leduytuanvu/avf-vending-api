name: POST /v1/admin/products — Create product (admin catalog) (Full With Brand Category Tags)
description: |-
  ## Purpose
  Create product (admin catalog)

  ## Auth mode
  `admin` — required: accessToken (set via 02 Auth login)

  ## Required variables
  accessToken (set via 02 Auth login)

  ## Headers
  - Accept: application/json
  - X-Request-ID: {{requestId}}
  - X-Correlation-ID: {{correlationId}}
  - Idempotency-Key: {{idempotencyKey}}
  - Authorization: Bearer {{accessToken}}
  - X-Request-ID: (from OpenAPI)
  - X-Correlation-ID: (from OpenAPI)
  - Idempotency-Key: (from OpenAPI)

  ## Path parameters
  _None_

  ## Query parameters
  _None_

  ## Required body fields
  - `active` (boolean)
  - `ageRestricted` (boolean)
  - `name` (string)
  - `sku` (string)

  ## Optional body fields
  - `allergenCodes` (array)
  - `attrs` (object)
  - `barcode` (string)
  - `brandId` (string (uuid))
  - `categoryId` (string (uuid))
  - `countryOfOrigin` (string)
  - `description` (string)
  - `nutritionalNote` (string)
  - `primaryMediaId` (string (uuid))
  - `status` (string) — Optional lifecycle alias; when set overrides active (active/sellable/published vs inactive/draft/archived).
  - `tagIds` (array)

  ## Enum / options
  _None documented in schema_

  ## Success response
  HTTP **200**

  ## Common failure statuses
  `400`, `401`, `403`, `409`, `500`

  ## Safety note
  Mutating — requires allowGatedWrites=true and confirmProductionWrites=I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION.

  ## Metadata
  - openapiOperationId: `DocOpV1AdminProductCreate`
  - openapiKey: `POST /v1/admin/products`
  - production_write: yes
  - idempotency: yes

  ## Variant
  (Full With Brand Category Tags)
url: "{{baseUrl}}/v1/admin/products"
method: POST
headers:
  Accept: application/json
  X-Request-ID: "{{requestId}}"
  X-Correlation-ID: "{{correlationId}}"
  Idempotency-Key: "{{idempotencyKey}}"
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{testProductName}} Full",
      "sku": "POSTMAN-FULL-{{randomSuffix}}",
      "active": true,
      "ageRestricted": false,
      "price": {
        "amount": 10000,
        "currency": "{{currency}}"
      },
      "brandId": "{{brandId}}",
      "categoryId": "{{categoryId}}",
      "tagIds": [
        "{{tagId}}"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      pm.environment.set('auth_type', 'admin');
      pm.collectionVariables.set('requires_idempotency', 'true');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("expected HTTP success unless negative test", function () {
        if (pm.collectionVariables.get('negative_test') === 'true') { return; }
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
