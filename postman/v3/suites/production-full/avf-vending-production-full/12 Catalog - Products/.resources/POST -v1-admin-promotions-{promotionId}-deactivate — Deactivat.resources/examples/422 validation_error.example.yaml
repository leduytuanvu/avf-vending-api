$kind: http-example
request:
  url: "{{baseUrl}}/"
  method: GET
response:
  statusCode: 422
  statusText: Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "validation_error",
          "message": "unprocessable entity",
          "requestId": "{{requestId}}"
        }
      }
order: 7000
