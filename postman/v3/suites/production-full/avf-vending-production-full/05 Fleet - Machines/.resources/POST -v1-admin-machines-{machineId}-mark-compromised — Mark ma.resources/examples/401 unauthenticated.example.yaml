$kind: http-example
request:
  url: "{{baseUrl}}/"
  method: GET
response:
  statusCode: 401
  statusText: Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "unauthenticated",
          "message": "authentication required",
          "requestId": "{{requestId}}"
        }
      }
order: 3000
