$kind: http-example
name: 200 Queue a machine setup / inventory sync command
request:
  url: "{{baseUrl}}/"
  method: GET
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "command": {
          "commandId": "bbbbbbbb-cccc-dddd-eeee-ffffffffffff",
          "dispatchState": "published",
          "replay": false,
          "sequence": 43
        }
      }
order: 1000
