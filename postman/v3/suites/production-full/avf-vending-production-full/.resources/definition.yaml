$kind: collection
id: 412a6b17-a1b2-c3d4-e5f6-7890abcdef01
name: AVF Vending Production (Full API)
description: |-
  Full REST+gRPC+MQTT production suite. Writes blocked unless production guards enabled.

  **Numeric folder prefixes:** Two-digit prefixes (00–35, 99) force stable sort order in Postman. REST domains use 01–29; gRPC 30–31; MQTT 32–35; utilities 99. gRPC/MQTT items are documentation/manual-setup entries (Postman v2.1 limitation).
variables:
  baseUrl: https://api.ldtv.dev
scripts:
  - type: http:beforeRequest
    code: |-
      /* global pm */
      function uuid4() {
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
          const r = (Math.random() * 16) | 0;
          const v = c === "x" ? r : (r & 0x3) | 0x8;
          return v.toString(16);
        });
      }
      /** RFC 9562 UUID v7 for client-supplied internal resource IDs (Postman canary bodies). */
      function uuid7() {
        let t = Date.now();
        const b = new Uint8Array(16);
        for (let i = 5; i >= 0; i--) {
          b[i] = t & 0xff;
          t = Math.floor(t / 256);
        }
        for (let i = 6; i < 16; i++) {
          b[i] = (Math.random() * 256) | 0;
        }
        b[6] = (b[6] & 0x0f) | 0x70;
        b[8] = (b[8] & 0x3f) | 0x80;
        const hex = Array.from(b, function (n) {
          return n.toString(16).padStart(2, "0");
        }).join("");
        return (
          hex.slice(0, 8) +
          "-" +
          hex.slice(8, 12) +
          "-" +
          hex.slice(12, 16) +
          "-" +
          hex.slice(16, 20) +
          "-" +
          hex.slice(20)
        );
      }
      function setIf(h, k, v) {
        if (!v) {
          return;
        }
        try {
          pm.request.headers.upsert({ key: k, value: String(v) });
        } catch (e) {
          pm.request.headers.add({ key: k, value: String(v) });
        }
      }
      const reqId = uuid4();
      const corr = uuid4();
      const idem = uuid4();
      const evId = uuid4();
      const resourceUUID = uuid7();
      const nowIso = new Date().toISOString();
      pm.collectionVariables.set("resource_uuid", resourceUUID);
      pm.collectionVariables.set("x_request_id", reqId);
      pm.collectionVariables.set("x_correlation_id", corr);
      pm.collectionVariables.set("idempotency_key", idem);
      pm.collectionVariables.set("event_id", evId);
      pm.collectionVariables.set("event_time", nowIso);
      pm.collectionVariables.set("now_iso", nowIso);
      try {
        const at = pm.environment.get("accessToken") || pm.environment.get("admin_token");
        if (at) pm.collectionVariables.set("admin_token", String(at));
        const mt = pm.environment.get("machineToken") || pm.environment.get("machine_token");
        if (mt) pm.collectionVariables.set("machine_token", String(mt));
        const tt = pm.environment.get("technicianToken") || pm.environment.get("technician_token");
        if (tt) pm.collectionVariables.set("technicianToken", String(tt));
      } catch (e) {}
      setIf(pm.request, "X-Request-ID", reqId);
      setIf(pm.request, "X-Correlation-ID", corr);
      setIf(pm.request, "X-Event-ID", evId);
      setIf(pm.request, "X-Event-Time", nowIso);
      setIf(pm.request, "Content-Type", "application/json");
      setIf(pm.request, "Accept", "application/json");
      setIf(pm.request, "X-Client-Name", "postman-avf");
      const appEnv =
        (pm.environment.get("app_env") || pm.collectionVariables.get("app_env") || "").toLowerCase();
      setIf(pm.request, "X-App-Env", appEnv || "unknown");
      const baseRaw =
        pm.environment.get("baseUrl") ||
        pm.environment.get("base_url") ||
        pm.collectionVariables.get("base_url") ||
        "";
      const base = baseRaw.toLowerCase();
      const pay = (pm.environment.get("payment_env") || "").toLowerCase();
      const mqtt = (
        pm.environment.get("mqtt_topic_prefix") ||
        pm.environment.get("mqttTopicPrefix") ||
        ""
      ).trim();
      const isStaging = appEnv === "staging" || /staging-api[.]ldtv[.]dev/.test(base);
      const isProd = appEnv === "production" || /(^|\/)api[.]ldtv[.]dev/.test(base);
      if (isStaging) {
        if (pay === "live") {
          throw new Error("postman-avf: staging cannot use payment_env=live");
        }
        if (mqtt === "avf/devices") {
          throw new Error("postman-avf: staging must not use production MQTT topic prefix avf/devices");
        }
      }
      if (isProd) {
        if (pay !== "live") {
          throw new Error("postman-avf: production requires payment_env=live");
        }
        if (mqtt !== "avf/devices") {
          throw new Error("postman-avf: production requires mqtt_topic_prefix=avf/devices");
        }
      }
      const method = (pm.request.method || "GET").toUpperCase();
      const isWrite = ["POST", "PUT", "PATCH", "DELETE"].indexOf(method) >= 0;
      try { pm.environment.set('requestId', reqId); pm.environment.set('correlationId', corr); pm.environment.set('idempotencyKey', idem); } catch (e) {}
      if (isWrite) { setIf(pm.request, 'Idempotency-Key', idem); }
      if (isWrite && isProd) {
        const okNew = pm.environment.get('allowGatedWrites') === 'true' && pm.environment.get('confirmProductionWrites') === 'I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION';
        const okLegacy = pm.environment.get('allow_mutation') === 'true' && pm.environment.get('allow_production_mutation') === 'true' && pm.environment.get('confirm_production_run') === 'I_UNDERSTAND_PRODUCTION_MUTATION';
        if (!okNew && !okLegacy) {
          throw new Error('postman-avf: production mutating request blocked. Enable allowGatedWrites+confirmProductionWrites OR legacy allow_mutation+allow_production_mutation+confirm_production_run');
        }
      }
        }
      }
      const isLocalDev =
        appEnv === "development" ||
        /localhost/.test(base) ||
        /127\.0\.0\.1/.test(base);
      if (isWrite && isLocalDev && method === "POST") {
        let urlStr = "";
        try {
          urlStr = pm.request.url.toString();
        } catch (e) {
          urlStr = String(pm.request.url || "");
        }
        const u = urlStr.replace(/\\/g, "/").toLowerCase();
        if (u.includes("/v1/admin/sites") && !/\/v1\/admin\/sites\//.test(u)) {
          const ad = pm.environment.get("allow_destructive");
          const cm = pm.environment.get("canaryMode");
          if (ad !== "true" && cm !== "true") {
            throw new Error(
              "postman-avf: local POST /v1/admin/sites requires allow_destructive=true or canaryMode=true",
            );
          }
        }
      }
      try { if (!pm.environment.get('postmanRunId')) { pm.environment.set('postmanRunId', reqId); pm.environment.set('testRunId', reqId); } } catch (e) {}
      try { if (!pm.environment.get('randomSuffix')) { pm.environment.set('randomSuffix', String(Date.now())); } } catch (e) {}
      const mode = (
        pm.environment.get("auth_type") ||
        pm.collectionVariables.get("auth_type") ||
        "public"
      ).toLowerCase();
      const bearerPlaceholders = {
        admin: "{{accessToken}}",
        machine: "{{machineToken}}",
        technician: "{{technicianToken}}",
      };
      let active = "";
      if (mode === "admin") {
        active =
          pm.environment.get("accessToken") ||
          pm.collectionVariables.get("accessToken") ||
          pm.environment.get("admin_token") ||
          pm.collectionVariables.get("admin_token") ||
          "";
      } else if (mode === "machine") {
        active =
          pm.environment.get("machineToken") ||
          pm.collectionVariables.get("machineToken") ||
          pm.environment.get("machine_token") ||
          pm.collectionVariables.get("machine_token") ||
          "";
      } else if (mode === "technician") {
        active =
          pm.environment.get("technicianToken") ||
          pm.collectionVariables.get("technicianToken") ||
          pm.environment.get("technician_token") ||
          pm.collectionVariables.get("technician_token") ||
          "";
      }
      pm.collectionVariables.set("active_token", active);
      if (mode === "webhook_hmac") {
        pm.request.headers.remove("Authorization");
        const ts = Math.floor(Date.now() / 1000);
        setIf(pm.request, "X-AVF-Webhook-Timestamp", String(ts));
        setIf(pm.request, "X-AVF-Webhook-Signature", pm.environment.get("webhookSignature") || "{{webhookSignature}}");
      } else if (mode === "admin" || mode === "machine" || mode === "technician") {
        const token = active || bearerPlaceholders[mode] || "";
        pm.request.headers.upsert({ key: "Authorization", value: "Bearer " + token });
      } else if (active) {
        pm.request.headers.upsert({ key: "Authorization", value: "Bearer " + active });
      } else {
        pm.request.headers.remove("Authorization");
      }
    language: text/javascript
  - type: http:afterResponse
    code: |-
      /* global pm */
      pm.test("Response time < 30s", function () {
        if (pm.response.responseTime >= 30000) {
          throw new Error("response too slow: " + pm.response.responseTime + "ms");
        }
      });
      function tryJson() {
        try {
          return pm.response.json();
        } catch (e) {
          return null;
        }
      }
      function envSet(k, v) {
        if (v === undefined || v === null || v === "") {
          return;
        }
        try {
          pm.environment.set(k, String(v));
        } catch (e) {}
      }
      function save(val, vname) {
        if (val === undefined || val === null || val === "") {
          return;
        }
        pm.collectionVariables.set(vname, String(val));
      }
      const j = tryJson();
      if (j) {
      const method = (pm.request.method || "GET").toUpperCase();
      let pathname = "";
      try {
        const parts = pm.request.url.path;
        if (parts && parts.length) {
          pathname = "/" + parts.join("/");
        }
      } catch (e) {
        pathname = "";
      }
      const pathLower = pathname.toLowerCase();
      const isTechnicianAuth =
        pathLower.indexOf("technician") >= 0 &&
        (pathLower.indexOf("/auth/") >= 0 || pathLower.indexOf("login") >= 0);
      const isAdminLogin = pathLower === "/v1/auth/login" || pathLower.endsWith("/auth/login");
      const isMachineClaim =
        pathLower.indexOf("activation/claim") >= 0 || pathLower.indexOf("/claim") >= 0;

      const tok = j.tokens || {};
      if (isTechnicianAuth) {
        const tt = tok.accessToken || j.accessToken || j.access_token || j.token;
        if (tt) {
          save(tt, "technician_token");
          envSet("technicianToken", tt);
          envSet("auth_type", "technician");
        }
        if (tok.refreshToken || j.refreshToken) {
          envSet("technicianRefreshToken", tok.refreshToken || j.refreshToken);
        }
      } else if (isAdminLogin && !isMachineClaim) {
        if (tok.accessToken) {
          save(tok.accessToken, "admin_token");
          envSet("accessToken", tok.accessToken);
        }
        if (tok.refreshToken) {
          envSet("refreshToken", tok.refreshToken);
        }
        if (tok.accessToken || j.accessToken) {
          envSet("auth_type", "admin");
        }
        if (j.accessToken) {
          save(j.accessToken, "admin_token");
          envSet("accessToken", j.accessToken);
        }
        if (j.access_token) {
          save(j.access_token, "admin_token");
          envSet("accessToken", j.access_token);
        }
        if (j.token) {
          save(j.token, "admin_token");
          envSet("accessToken", j.token);
        }
      }

      if (j.machineToken) {
        save(j.machineToken, "machine_token");
        envSet("machineToken", j.machineToken);
        envSet("auth_type", "machine");
      }
      if (j.machine_token) {
        save(j.machine_token, "machine_token");
        envSet("machineToken", j.machine_token);
        envSet("auth_type", "machine");
      }
      const cred = j.credentials || {};
      if (cred.machineToken) {
        save(cred.machineToken, "machine_token");
        envSet("machineToken", cred.machineToken);
        envSet("auth_type", "machine");
      }
      if (cred.accessToken && isMachineClaim) {
        save(cred.accessToken, "machine_token");
        envSet("machineToken", cred.accessToken);
        envSet("auth_type", "machine");
      }
      if (cred.refreshToken) {
        envSet("machineRefreshToken", cred.refreshToken);
      }

      const flat = [
        ["mediaId", "mediaId"],
        ["activationCode", "activationCode"],
        ["activationCodeId", "activationCodeId"],
        ["orderId", "orderId"],
        ["order_id", "orderId"],
        ["machineId", "machineId"],
        ["siteId", "siteId"],
        ["paymentId", "paymentId"],
        ["vendId", "vendSessionId"],
        ["vendSessionId", "vendSessionId"],
        ["refundId", "refundId"],
        ["commandId", "commandId"],
        ["planogramId", "planogramId"],
        ["assignmentId", "assignmentId"],
        ["technicianId", "technicianId"],
        ["technicianToken", "technicianToken"],
        ["campaignId", "campaignId"],
        ["featureFlagId", "featureFlagId"],
        ["rolloutId", "rolloutId"],
        ["artifactId", "artifactId"],
        ["reportExportId", "reportExportId"],
        ["priceBookId", "priceBookId"],
        ["promotionId", "promotionId"],
        ["caseId", "caseId"],
        ["batchId", "batchId"],
        ["operatorSessionId", "operatorSessionId"],
        ["eventId", "eventId"],
        ["outboxId", "outboxId"],
        ["resourceId", "resourceId"],
      ];
      flat.forEach(function (pair) {
        if (j[pair[0]] !== undefined && j[pair[0]] !== null && j[pair[0]] !== "") {
          envSet(pair[1], j[pair[0]]);
        }
      });

      if (j.catalogVersion !== undefined && j.catalogVersion !== null) {
        envSet("catalogVersion", String(j.catalogVersion));
      }
      if (j.mediaManifestVersion !== undefined && j.mediaManifestVersion !== null) {
        envSet("mediaManifestVersion", String(j.mediaManifestVersion));
      }
      if (j.machine && j.machine.id) {
        save(j.machine.id, "machine_id");
        envSet("machineId", j.machine.id);
      }
      if (j.data) {
        const d = j.data;
        if (d.machineId) {
          save(d.machineId, "machine_id");
          envSet("machineId", d.machineId);
        }
        if (d.orderId) {
          save(d.orderId, "order_id");
          envSet("orderId", d.orderId);
        }
        if (d.accessToken && isAdminLogin) {
          save(d.accessToken, "admin_token");
          envSet("accessToken", d.accessToken);
        }
      }
      if (j.order && j.order.id) {
        save(j.order.id, "order_id");
        envSet("orderId", j.order.id);
      }
      if (j.payment && j.payment.id) {
        save(j.payment.id, "payment_id");
        envSet("paymentId", j.payment.id);
      }
      if (j.vend && j.vend.id) {
        save(j.vend.id, "vend_id");
        envSet("vendSessionId", j.vend.id);
      }
      if (j.refund && j.refund.id) {
        save(j.refund.id, "refund_id");
        envSet("refundId", j.refund.id);
      }
      if (j.command && j.command.id) {
        envSet("commandId", j.command.id);
      }
      if (j.planogram && j.planogram.id) {
        envSet("planogramId", j.planogram.id);
      }
      if (j.assignment && j.assignment.id) {
        envSet("assignmentId", j.assignment.id);
      }

      if (method === "POST" && pm.response.code >= 200 && pm.response.code < 300 && j.id) {
        const tail = pathname.replace(/^\/+/, "");
        const id = String(j.id);
        const postMap = {
          "v1/admin/categories": "categoryId",
          "v1/admin/brands": "brandId",
          "v1/admin/tags": "tagId",
          "v1/admin/products": "productId",
          "v1/admin/sites": "siteId",
          "v1/admin/machines": "machineId",
          "v1/admin/activation-codes": "activationCodeId",
          "v1/admin/technician-assignments": "assignmentId",
          "v1/admin/assignments": "assignmentId",
          "v1/admin/feature-flags": "featureFlagId",
          "v1/admin/ota/campaigns": "campaignId",
          "v1/admin/machine-config/rollouts": "rolloutId",
          "v1/admin/rollouts": "rolloutId",
          "v1/commerce/orders": "orderId",
        };
        if (postMap[tail]) {
          envSet(postMap[tail], id);
        }
        if (tail.indexOf("commands") >= 0 && tail.indexOf("machines") >= 0) {
          envSet("commandId", id);
        }
        if (tail.indexOf("planograms") >= 0) {
          envSet("planogramId", id);
        }
        if (tail.indexOf("payment-session") >= 0 || tail.indexOf("/payments") >= 0) {
          envSet("paymentId", id);
        }
      }
      }
    language: text/javascript
