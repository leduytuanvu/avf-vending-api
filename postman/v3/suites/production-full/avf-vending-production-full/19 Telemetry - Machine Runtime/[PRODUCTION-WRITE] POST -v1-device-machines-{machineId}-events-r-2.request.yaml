$kind: http-request
name: "[PRODUCTION-WRITE] POST /v1/device/machines/{machineId}/events/reconcile — Batch reconcile critical telemetry idempotency keys (Invalid machine_id, negative)"
description: |-
  ## Purpose
  Batch reconcile critical telemetry idempotency keys

  ## Auth mode
  `machine` — required: machineToken

  ## Required variables
  machineToken

  ## Headers
  - Accept: application/json
  - X-Request-ID: {{requestId}}
  - X-Correlation-ID: {{correlationId}}
  - Authorization: Bearer {{machineToken}}
  - X-Request-ID: (from OpenAPI)
  - X-Correlation-ID: (from OpenAPI)

  ## Path parameters
  - `machineId` (string)

  ## Query parameters
  _None_

  ## Required body fields
  _None_

  ## Optional body fields
  _None_

  ## Enum / options
  _None documented in schema_

  ## Success response
  HTTP **200**

  ## Common failure statuses
  `400`, `401`, `403`, `500`

  ## Safety note
  Mutating — requires allowGatedWrites=true and confirmProductionWrites=I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION. **HIGH RISK** — item disabled by default.

  ## Metadata
  - openapiOperationId: `DocOpV1DeviceTelemetryReconcileBatch`
  - openapiKey: `POST /v1/device/machines/{machineId}/events/reconcile`
  - production_write: yes
  - idempotency: no

