$kind: http-example
request:
  url: "{{baseUrl}}/"
  method: GET
response:
  statusCode: 403
  statusText: Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "forbidden",
          "message": "permission denied",
          "requestId": "{{requestId}}"
        }
      }
order: 6000
