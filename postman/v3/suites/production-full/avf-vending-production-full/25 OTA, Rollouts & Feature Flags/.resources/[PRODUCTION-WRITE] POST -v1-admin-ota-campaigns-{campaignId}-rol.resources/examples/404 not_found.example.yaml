$kind: http-example
request:
  url: "{{baseUrl}}/"
  method: GET
response:
  statusCode: 404
  statusText: Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "not_found",
          "message": "resource not found",
          "requestId": "{{requestId}}"
        }
      }
order: 8000
