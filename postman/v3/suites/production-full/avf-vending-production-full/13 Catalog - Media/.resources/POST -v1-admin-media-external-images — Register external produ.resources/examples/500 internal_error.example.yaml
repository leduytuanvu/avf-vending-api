$kind: http-example
request:
  url: "{{baseUrl}}/"
  method: GET
response:
  statusCode: 500
  statusText: Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "internal_error",
          "message": "internal server error",
          "requestId": "{{requestId}}"
        }
      }
order: 10000
