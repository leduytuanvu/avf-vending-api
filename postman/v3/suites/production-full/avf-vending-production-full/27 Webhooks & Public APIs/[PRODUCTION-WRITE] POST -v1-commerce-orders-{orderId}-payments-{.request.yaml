$kind: http-request
name: "[PRODUCTION-WRITE] POST /v1/commerce/orders/{orderId}/payments/{paymentId}/webhooks — Apply provider webhook"
description: |-
  ## Purpose
  Apply provider webhook

  ## Auth mode
  `webhook_hmac` — required: webhookSignature, webhookTimestamp

  ## Required variables
  webhookSignature, webhookTimestamp

  ## Headers
  - Accept: application/json
  - X-Request-ID: {{requestId}}
  - X-Correlation-ID: {{correlationId}}
  - Authorization: _none (webhook HMAC)_
  - X-AVF-Webhook-Timestamp: (from OpenAPI)
  - X-AVF-Webhook-Signature: (from OpenAPI)
  - X-Request-ID: (from OpenAPI)
  - X-Correlation-ID: (from OpenAPI)

  ## Path parameters
  - `orderId` (string)
  - `paymentId` (string)

  ## Query parameters
  _None_

  ## Required body fields
  _None_

  ## Optional body fields
  _None_

  ## Enum / options
  _None documented in schema_

  ## Success response
  HTTP **200**

  ## Common failure statuses
  `400`, `401`, `403`, `404`, `409`, `429`, `500`, `503`

  ## Safety note
  Mutating — requires allowGatedWrites=true and confirmProductionWrites=I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION. **HIGH RISK** — item disabled by default.

  ## Metadata
  - openapiOperationId: `DocOpV1CommercePaymentWebhook`
  - openapiKey: `POST /v1/commerce/orders/{orderId}/payments/{paymentId}/webhooks`
  - production_write: yes
  - idempotency: no
url: "{{baseUrl}}/v1/commerce/orders/{{orderId}}/payments/{{paymentId}}/webhooks"
method: POST
headers:
  Accept: application/json
  X-Request-ID: "{{requestId}}"
  X-Correlation-ID: "{{correlationId}}"
  X-AVF-Webhook-Timestamp: "{{webhookTimestamp}}"
  X-AVF-Webhook-Signature: "{{webhookSignature}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "event_type": "payment_intent.succeeded",
      "normalized_payment_state": "captured",
      "payload_json": {
        "id": "pi_example_123",
        "status": "succeeded"
      },
      "provider": "stripe",
      "provider_reference": "pi_example_123"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      pm.environment.set('auth_type', 'webhook_hmac');
      pm.collectionVariables.set('requires_idempotency', 'false');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("expected HTTP success unless negative test", function () {
        if (pm.collectionVariables.get('negative_test') === 'true') { return; }
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
examples: ./.resources/[PRODUCTION-WRITE] POST -v1-commerce-orders-{orderId}-payments-{.resources/examples
order: 1000
